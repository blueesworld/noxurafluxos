<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050811">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NoxuraFluxOS 8.6</title>
<style>
:root{
  --accent:#2f8cff;--accent-2:#5ad8ff;--accent-soft:#8fc4ff;
  --danger:#ff4d42;--ok:#46e39b;
  --text:#eef3ff;--muted:#93a6c8;
  --line:rgba(160,195,255,.14);
  --panel:rgba(14,22,42,.62);
  --ui:1;--frame:0px;--hints-h:2.6rem;
}
html.hc{--muted:#c9d6ee;--line:rgba(200,225,255,.42)}
html{font-size:calc(clamp(10px,1.1vh + .36vw,18px) * var(--ui));height:100%;background:#050811}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI","SF Pro Text",system-ui,-apple-system,Helvetica,Arial,sans-serif;color:var(--text);user-select:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
svg{display:block}
#app{position:fixed;inset:var(--frame);overflow:hidden;background:#050811}
#bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#shade{position:absolute;inset:0;pointer-events:none;z-index:1;background:linear-gradient(180deg,rgba(5,8,17,.15),rgba(5,8,17,.9))}

/* ---------- views ---------- */
.view{position:absolute;left:0;right:0;top:0;bottom:var(--hints-h);display:none;flex-direction:column;min-width:0;z-index:5;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.view.active{display:flex;animation:viewIn .34s cubic-bezier(.22,.7,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(.6rem)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes tileIn{from{opacity:0;transform:translateX(1.2rem)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes markIn{from{opacity:0;letter-spacing:.7em}to{opacity:1;letter-spacing:.42em}}
@keyframes shine{0%{left:-60%}60%,100%{left:120%}}

/* ---------- focus ---------- */
[data-f]{position:relative;outline:none}
[data-f].is-focus{box-shadow:0 0 0 .16rem #fff,0 0 0 .32rem rgba(47,140,255,.55);z-index:3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.6rem 1.3rem;border-radius:.5rem;font-size:.84rem;font-weight:600;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--text);transition:transform .15s,background .15s,box-shadow .15s}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.danger{background:rgba(255,77,66,.14);border-color:rgba(255,77,66,.4);color:#ffb2ac}
.btn.ghost{background:transparent}
.btn.is-focus{background:#fff;color:#0a1220;transform:scale(1.03)}
.btn.primary.is-focus{background:#fff;color:#0a1220}
.chips{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.chip{padding:.32rem .85rem;border-radius:99rem;font-size:.7rem;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted)}
.chip.on{background:rgba(255,255,255,.14);color:#fff}
.chip.is-focus{background:#fff;color:#0a1220;transform:scale(1.04)}
.iconbtn{width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;color:#d8e4fa;background:rgba(255,255,255,.06);transition:transform .15s,background .15s}
.iconbtn svg{width:1.05rem;height:1.05rem}
.iconbtn.is-focus{background:#fff;color:#0a1220;transform:scale(1.08)}
.badge{position:absolute;top:-.2rem;right:-.2rem;min-width:1rem;height:1rem;padding:0 .25rem;border-radius:99rem;background:var(--ok);color:#03241a;font-size:.58rem;font-weight:800;display:grid;place-items:center}
.avatar{border-radius:50%;overflow:hidden;background:#0c1428;display:grid;place-items:center;flex:none}
.avatar svg{width:100%;height:100%}
.empty{padding:2rem;color:var(--muted);font-size:.8rem;text-align:center}
.sec-title{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:1.3rem 0 .6rem}
.kv{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.6rem 0;border-bottom:1px solid var(--line);font-size:.8rem}
.kv b{color:var(--muted);font-weight:500}
.kv span{font-weight:600;text-align:right}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;padding:.22rem .6rem;border-radius:99rem;font-size:.66rem;font-weight:700;background:rgba(70,227,155,.12);color:#9df5c9}
.pill.off{background:rgba(255,255,255,.06);color:var(--muted)}
.sbar{height:.4rem;border-radius:99rem;background:rgba(255,255,255,.08);overflow:hidden;margin-top:.8rem}
.sbar i{display:block;height:100%;background:var(--accent)}
.slegend{display:flex;justify-content:space-between;font-size:.66rem;color:var(--muted);margin-top:.35rem}
.bar{height:.3rem;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden;margin-top:.35rem}
.bar i{display:block;height:100%;background:var(--accent)}
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.1) 37%,rgba(255,255,255,.04) 63%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:.7rem}
.loading{display:flex;align-items:center;gap:.9rem;color:var(--muted);font-size:.8rem;padding:1rem 0}
.spin{width:1.4rem;height:1.4rem;border-radius:50%;border:.18rem solid rgba(255,255,255,.14);border-top-color:var(--accent);animation:spin .8s linear infinite}

/* ---------- settings controls ---------- */
.setrow{display:flex;justify-content:space-between;align-items:center;gap:1.2rem;padding:.75rem .2rem;border-bottom:1px solid var(--line)}
.setrow .tl{font-size:.82rem;font-weight:600}
.setrow .ts{font-size:.7rem;color:var(--muted);margin-top:.2rem;line-height:1.45}
.setrow .sc{display:flex;align-items:center;justify-content:flex-end;flex:none;gap:.6rem}
.toggle{width:2.6rem;height:1.45rem;border-radius:99rem;background:rgba(255,255,255,.14);position:relative;transition:background .2s;flex:none}
.toggle i{position:absolute;top:.14rem;left:.14rem;width:1.17rem;height:1.17rem;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{background:var(--accent)}
.toggle.on i{transform:translateX(1.15rem)}
.toggle.is-focus{box-shadow:0 0 0 .16rem #fff,0 0 0 .32rem rgba(47,140,255,.55)}
.seg{display:inline-flex;background:rgba(255,255,255,.06);border-radius:99rem;padding:.15rem;gap:.1rem;flex-wrap:wrap}
.seg button{padding:.32rem .75rem;border-radius:99rem;font-size:.7rem;font-weight:600;color:var(--muted)}
.seg button.on{background:rgba(255,255,255,.16);color:#fff}
.seg button.is-focus{background:#fff;color:#0a1220}
.range{display:flex;align-items:center;gap:.8rem;width:min(20rem,46vw)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:.3rem;border-radius:99rem;background:linear-gradient(90deg,var(--accent) var(--p,50%),rgba(255,255,255,.12) var(--p,50%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1rem;height:1rem;border-radius:50%;background:#fff}
input[type=range]::-moz-range-thumb{width:1rem;height:1rem;border:0;border-radius:50%;background:#fff}
input[type=range].is-focus{box-shadow:0 0 0 .16rem #fff,0 0 0 .32rem rgba(47,140,255,.55)}
.rlbl{min-width:3.4rem;text-align:right;font-size:.74rem;font-weight:600;font-variant-numeric:tabular-nums}
.swatches{display:flex;gap:.55rem;flex-wrap:wrap}
.sw{width:1.8rem;height:1.8rem;border-radius:50%;border:2px solid transparent;transition:transform .14s}
.sw.sel{border-color:#fff}
.sw.is-focus{transform:scale(1.15)}
.avatars{display:flex;flex-wrap:wrap;gap:.6rem}
.av{width:3.2rem;height:3.2rem;border-radius:50%;overflow:hidden;border:2px solid transparent;transition:transform .14s}
.av svg{width:100%;height:100%}
.av.sel{border-color:var(--accent)}
.av.is-focus{transform:scale(1.1)}
.pad-state{font-family:ui-monospace,Consolas,monospace;font-size:.72rem;color:var(--accent-soft);margin-top:.4rem;min-height:1.1rem}
.controller-vis{display:flex;align-items:center;gap:1rem;padding:.9rem 1rem;border-radius:.6rem;background:var(--panel);border:1px solid var(--line);margin-bottom:.8rem}

/* ---------- hints ---------- */
#hints{position:absolute;left:0;right:0;bottom:0;height:var(--hints-h);display:flex;align-items:center;justify-content:space-between;padding:0 1.6rem;font-size:.7rem;color:var(--muted);pointer-events:none;z-index:60;background:linear-gradient(0deg,rgba(3,5,12,.92),rgba(3,5,12,0))}
#hints .hgroup{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.hitem{display:inline-flex;align-items:center;white-space:nowrap}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:1.4rem;height:1.4rem;padding:0 .3rem;margin-right:.4rem;border-radius:.35rem;background:rgba(255,255,255,.1);font-size:.66rem;font-weight:800;color:#fff}

/* ---------- boot ---------- */
#view-boot{align-items:center;justify-content:center}
.boot-logo{display:flex;flex-direction:column;align-items:center;gap:1rem}
.boot-mark{position:relative;font-size:clamp(2.4rem,6.5vw,5rem);font-weight:700;letter-spacing:.42em;padding-left:.42em;overflow:hidden;color:#f2f7ff;animation:markIn 1.3s cubic-bezier(.16,1,.3,1) both}
.boot-mark .shine{position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 2.6s 1s ease-in-out infinite}
.boot-os{font-size:.8rem;letter-spacing:.42em;color:var(--accent-soft);opacity:0;animation:fadeIn .8s .8s both;padding-left:.42em}
.boot-os b{color:#fff;font-weight:700}
.boot-bar{width:min(18rem,46vw);height:.16rem;border-radius:99rem;overflow:hidden;background:rgba(255,255,255,.1);margin-top:.8rem;opacity:0;animation:fadeIn .5s 1s both}
.boot-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width 2.6s cubic-bezier(.4,0,.2,1)}
.boot-hint{margin-top:1.4rem;font-size:.72rem;color:var(--muted);opacity:0;animation:fadeIn .6s 1.6s both;padding:.3rem .6rem;border-radius:.4rem}
.boot-hint.is-focus{color:#fff}

/* ---------- setup ---------- */
#view-setup{padding:2rem 3.2rem}
.setup-shell{display:flex;flex-direction:column;height:100%;gap:1rem}
.setup-step{font-size:.68rem;letter-spacing:.2em;color:var(--accent-soft);font-weight:700}
.setup-title{font-size:1.8rem;font-weight:600;margin:.4rem 0 0}
.setup-sub{margin:.4rem 0 0;color:var(--muted);font-size:.84rem;max-width:60ch;line-height:1.5}
.setup-body{flex:1;min-height:0;overflow-y:auto;padding:.6rem .2rem;display:flex;flex-direction:column;gap:.6rem;align-items:flex-start;scrollbar-width:none;max-width:44rem}
.setup-foot{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.opt{display:flex;flex-direction:column;gap:.25rem;padding:.9rem 1.2rem;border-radius:.6rem;min-width:16rem;background:var(--panel);border:1px solid var(--line);transition:transform .14s,background .15s;text-align:left}
.opt b{font-size:.92rem;font-weight:600}
.opt span{font-size:.7rem;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:rgba(47,140,255,.14)}
.opt.is-focus{transform:translateX(.3rem);background:rgba(255,255,255,.1)}
.calib{width:100%;height:8rem;border-radius:.6rem;position:relative;border:1px dashed rgba(170,200,255,.35);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.74rem;margin-bottom:.4rem}
.calib span{position:absolute;inset:.8rem;border:1px solid rgba(170,200,255,.2);border-radius:.4rem}

/* ---------- profiles ---------- */
#view-profiles{align-items:center;justify-content:center;gap:2rem}
.profiles-title{font-size:1.5rem;font-weight:300;letter-spacing:.1em;color:#e6eefc}
.profiles-row{display:flex;gap:2rem;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.profile-card{display:flex;flex-direction:column;align-items:center;gap:.6rem;padding:.8rem;border-radius:.8rem;width:9rem;transition:transform .16s,background .16s}
.profile-card .big{width:5.4rem;height:5.4rem;border-radius:50%;overflow:hidden;border:2px solid transparent;transition:border-color .2s}
.profile-card .big svg{width:100%;height:100%}
.profile-card .nm{font-size:.88rem;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-card .lv{font-size:.66rem;color:var(--muted)}
.profile-card.add .big{display:grid;place-items:center;border:1px dashed rgba(170,200,255,.4);font-size:1.6rem;color:var(--muted)}
.profile-card.is-focus{transform:translateY(-.3rem);background:rgba(255,255,255,.05)}
.profile-card.is-focus .big{border-color:#fff}

/* ---------- home ---------- */
#view-home{overflow:hidden}
#heroArt{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center 30%;animation:fadeIn .5s both}
#heroArt::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#050811 0%,rgba(5,8,17,.55) 40%,rgba(5,8,17,.25) 100%),linear-gradient(90deg,rgba(5,8,17,.5),transparent 60%)}
.topbar{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 1.6rem .4rem}
.top-left{display:flex;align-items:center;gap:1.4rem;min-width:0}
.top-right{display:flex;align-items:center;gap:.5rem}
.profile-chip{display:flex;align-items:center;gap:.6rem;padding:.2rem .8rem .2rem .25rem;border-radius:99rem;border:1px solid transparent;transition:border-color .2s,background .2s}
.profile-chip .avatar{width:2rem;height:2rem}
.profile-chip.is-focus{background:rgba(255,255,255,.1)}
.pname{font-size:.82rem;font-weight:600;max-width:10rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plvl{font-size:.64rem;color:var(--muted)}
.tabs{display:flex;gap:.2rem}
.tab{padding:.4rem .95rem;border-radius:99rem;font-size:.8rem;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.tab.on{color:#fff;background:rgba(255,255,255,.1)}
.tab.is-focus{background:#fff;color:#0a1220}
.status{display:flex;align-items:center;gap:.7rem;margin-left:.4rem;color:#d8e4fa;font-size:.74rem}
.status svg{width:1rem;height:1rem}
#clock{font-variant-numeric:tabular-nums;font-weight:600}
.hero{position:relative;z-index:5;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 2rem .4rem;pointer-events:none}
.hero-text.swap{animation:fadeIn .35s both}
.hero-kicker{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-soft);font-weight:700}
.hero-title{font-size:clamp(1.5rem,3.2vw,2.6rem);font-weight:600;margin:.3rem 0 .2rem;line-height:1.1}
.hero-sub{font-size:.8rem;color:#c5d4ee;margin:0;max-width:56ch;line-height:1.45}
.rail-label{position:relative;z-index:5;padding:0 2rem;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rail{position:relative;z-index:5;display:flex;align-items:center;gap:1rem;padding:1.4rem 2rem 1.6rem;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tile{position:relative;flex:none;border-radius:.7rem;height:clamp(8.5rem,40vh,19rem);aspect-ratio:3/4;background:#0c1428;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .2s cubic-bezier(.22,.7,.2,1);animation:tileIn .45s cubic-bezier(.22,.7,.2,1) both;animation-delay:calc(var(--i,0) * 50ms)}
.tile .art{position:absolute;inset:0;background-size:cover;background-position:center}
.tile .art::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,8,17,.92) 2%,rgba(5,8,17,0) 60%)}
.tile .tmeta{position:relative;z-index:2;padding:.7rem .75rem;display:flex;flex-direction:column;gap:.1rem}
.tile .tname{font-size:.8rem;font-weight:600;line-height:1.2}
.tile .tsub{font-size:.6rem;color:#b9c9e6;letter-spacing:.05em;text-transform:uppercase}
.tile.is-focus{transform:translateY(-.4rem) scale(1.04)}
.tile.add{display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px dashed rgba(170,200,255,.3)}
.tile.add .plus{font-size:2rem;font-weight:200;color:var(--accent-soft);line-height:1}
.tile.add .label{margin-top:.5rem;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding:0 .8rem}

/* ---------- store ---------- */
.store-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 2rem .3rem;flex-wrap:wrap}
.store-title{font-size:1.4rem;font-weight:600;margin:0}
.store-title span{color:var(--accent-soft);font-weight:400}
.store-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 2rem 1.4rem;scrollbar-width:none;animation:fadeIn .4s both}
.store-body::-webkit-scrollbar{display:none}
.hero-banner{position:relative;border-radius:.9rem;overflow:hidden;height:clamp(9rem,32vh,17rem);display:flex;align-items:flex-end;padding:1.2rem 1.4rem;margin:.6rem 0 .8rem;border:1px solid var(--line)}
.hb-art{position:absolute;inset:0;background-size:cover;background-position:center}
.hb-art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,8,17,.92) 10%,rgba(5,8,17,.2) 70%)}
.hb-info{position:relative;z-index:2;display:flex;flex-direction:column;gap:.3rem;max-width:60%}
.hb-kicker{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-soft);font-weight:700}
.hb-title{font-size:1.4rem;font-weight:600;margin:0}
.hb-sub{font-size:.76rem;color:#c5d4ee;margin:0 0 .4rem}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(8rem,15vw,12.5rem),1fr));gap:.9rem}
.sk{aspect-ratio:3/4}
.card{border-radius:.6rem;overflow:hidden;background:var(--panel);border:1px solid var(--line);transition:transform .16s}
.c-art{position:relative;aspect-ratio:3/4;background-size:cover;background-position:center}
.lock{position:absolute;top:.4rem;right:.4rem;font-size:.5rem;letter-spacing:.08em;font-weight:700;padding:.15rem .35rem;border-radius:.25rem;background:rgba(255,77,66,.9);color:#fff}
.c-meta{padding:.55rem .6rem .65rem;display:flex;flex-direction:column;gap:.15rem}
.c-name{font-size:.76rem;font-weight:600;line-height:1.2}
.c-tag{font-size:.6rem;color:var(--muted)}
.card.is-focus{transform:translateY(-.25rem)}

/* ---------- store detail ---------- */
#view-detail{padding:0}
.detail-wrap{display:flex;flex-direction:column;height:100%;min-height:0}
.detail-hero{position:relative;height:clamp(8rem,30vh,16rem);flex:none;overflow:hidden}
.d-art{position:absolute;inset:0;background-size:cover;background-position:center 30%}
.d-art::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#050811 2%,rgba(5,8,17,.4) 60%,rgba(5,8,17,.7) 100%)}
.detail-head{position:absolute;left:2rem;right:2rem;bottom:.9rem;z-index:2}
.detail-title{font-size:clamp(1.3rem,2.6vw,2.1rem);font-weight:600;margin:0}
.detail-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
.detail-body{flex:1;min-height:0;overflow-y:auto;padding:1rem 2rem 1.4rem;display:grid;grid-template-columns:1.4fr 1fr;gap:1.8rem;scrollbar-width:none;align-content:start}
.detail-body::-webkit-scrollbar{display:none}
.detail-desc{font-size:.82rem;line-height:1.6;color:#c5d4ee;margin:0 0 .8rem}
.trailer{position:relative;border-radius:.6rem;overflow:hidden;aspect-ratio:16/9;border:1px solid var(--line);background-size:cover;background-position:center;margin-bottom:.4rem}
.trailer .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,8,17,.3)}
.trailer .play i{width:2.4rem;height:2.4rem;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-style:normal;color:#fff;font-size:.7rem}
.trailer .lbl{position:absolute;left:.6rem;bottom:.5rem;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:#e6eefc}
.drow{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.78rem}
.drow b{color:var(--muted);font-weight:500}
.buybox{display:flex;flex-direction:column;gap:.6rem;align-content:start}
.buybox .btn{width:100%}
.buybtn-off{width:100%;padding:.8rem 1.2rem;border-radius:.5rem;font-weight:700;font-size:.86rem;background:rgba(255,255,255,.05);color:#6f7f99;border:1px solid var(--line);cursor:not-allowed}
.buybtn-off.is-focus{background:rgba(255,77,66,.1);color:#ffb2ac;border-color:rgba(255,77,66,.5)}

/* ---------- game page ---------- */
#view-game{padding:0}
.g-art{position:absolute;inset:0;background-size:cover;background-position:center 25%;animation:fadeIn .5s both}
.g-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,8,17,.96) 8%,rgba(5,8,17,.45) 65%),linear-gradient(0deg,#050811 0%,rgba(5,8,17,0) 55%)}
.g-wrap{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;padding:.8rem 2.2rem 1rem;min-height:0}
.g-tabs{display:flex;gap:.2rem;justify-content:center;flex:none}

.trophy-row{display:flex;align-items:center;gap:.9rem;padding:.6rem 0;border-bottom:1px solid var(--line)}

/* ---------- library / gallery ---------- */
.lib-head{padding:.9rem 2rem .5rem;display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap}

.lpkg{font-size:.6rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltxt{min-width:0;flex:1}
.check{width:1.1rem;height:1.1rem;border-radius:.3rem;border:1px solid rgba(170,200,255,.45);display:grid;place-items:center;font-size:.66rem;color:#0a1220;flex:none}

.lib-foot{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 2rem 1rem;flex-wrap:wrap}

.pname2{font-size:.76rem;font-weight:600;margin-top:.2rem}
.friends-list{flex:1;min-height:0;overflow-y:auto;padding:0 .8rem;scrollbar-width:none}

.qm-inner{border-radius:.8rem;padding:.8rem .9rem;background:rgba(12,19,36,.97);border:1px solid var(--line);display:flex;flex-direction:column;gap:.7rem}

.qbtn{flex:none;min-width:5.6rem;height:3.2rem;padding:0 .9rem;border-radius:.5rem;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:.72rem;font-weight:600;color:#d8e4fa;transition:transform .15s,background .15s}

.qm-vol.is-focus{background:#fff;color:#0a1220}
.qm-vol .lab{font-size:.66rem;white-space:nowrap}
.volbar{flex:1;height:.3rem;border-radius:99rem;background:rgba(255,255,255,.14);position:relative}
.volbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99rem;background:var(--accent)}
.vlabel{font-size:.62rem;min-width:2.2rem;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- dialog / toast ---------- */
#dialogLayer{position:absolute;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(3,5,12,.7);padding:2rem}
#dialogLayer.open{display:flex;animation:fadeIn .2s both}
.dialog-card{width:min(32rem,86vw);max-height:80vh;overflow-y:auto;border-radius:.8rem;padding:1.3rem 1.4rem;background:#0d1628;border:1px solid var(--line)}
.dlg-kicker{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-soft);font-weight:700;margin-bottom:.4rem}
.dlg-title{font-size:1.1rem;font-weight:600;margin:0 0 .5rem}
.dlg-body{font-size:.8rem;line-height:1.6;color:#c5d4ee}
.dlg-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.1rem;flex-wrap:wrap}
#toast{position:absolute;left:50%;bottom:calc(var(--hints-h) + 1rem);transform:translate(-50%,.8rem);z-index:95;padding:.55rem 1rem;border-radius:.4rem;font-size:.74rem;font-weight:600;background:#101b33;border:1px solid var(--line);opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- rotate ---------- */
#rotate{position:absolute;inset:0;z-index:120;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;background:#050811;text-align:center;padding:2rem}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
#rotate p{font-size:.8rem;color:var(--muted);max-width:28ch;line-height:1.6;margin:0}

@media (max-height:26rem){
  :root{--hints-h:2.1rem}
  .hero-sub{display:none}
  .rail-label{display:none}
  .tile{height:clamp(7rem,44vh,14rem)}
}
html.noanim *,html.noanim *::before,html.noanim *::after{animation:none!important;transition:none!important}
</style>
</head>

function takeShot() {
  const c = document.createElement('canvas');
  c.width = 640; c.height = 360;
  const x = c.getContext('2d');
  x.drawImage(bg, 0, 0, 640, 360);
  x.fillStyle = 'rgba(0,0,0,.45)'; x.fillRect(0, 324, 640, 36);
  x.fillStyle = '#e6eefc'; x.font = '14px sans-serif';
  x.fillText('NoxuraFluxOS 8.6 · ' + new Date().toLocaleString('de-DE'), 16, 347);
  const d = c.toDataURL('image/jpeg', .75);
  S.captures.unshift({ d, t: new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) });
  S.captures = S.captures.slice(0, 12);
  save(); sfx('ok'); toast('Screenshot gespeichert');
}

/* ================= friends ================= */
function renderFriends() {
  const on = S.friends.filter(f => f.on).length;
  $('#friendsTitle').textContent = t('friends');
  $('#friendsSub').textContent = `${on} online · ${S.friends.length} gesamt`;
  $('#friendAdd').textContent = 'Freund hinzufügen';
  const party = S.party.map(id => S.friends.find(f => f.id === id)).filter(Boolean);
  $('#partyBox').innerHTML = `<div class="plabel">Party · ${party.length + 1} von 4</div><div class="pname2">${['Du', ...party.map(f => esc(f.n))].join(', ')}</div>`;
  $('#friendsList').innerHTML = S.friends.map((f, i) => {
    const inP = S.party.includes(f.id);
    return `<div class="frow" data-f data-action="friend-invite" data-id="${f.id}"${i === 0 ? ' data-default' : ''}>
      <div class="avatar" style="width:2.1rem;height:2.1rem">${avatarSVG(hash(f.n) % 6, '#8fc4ff')}</div>
      <div class="fmeta"><div class="fname"><span class="dot${f.on ? '' : ' off'}"></span>${esc(f.n)}</div>
      <div class="fact">${f.on ? (f.g ? 'Spielt ' + esc(f.g) : 'Online') : 'Offline'}</div></div>
      <span class="chip${inP ? ' on' : ''}">${inP ? 'In Party' : 'Einladen'}</span></div>`;
  }).join('') || '<div class="empty">Noch keine Freunde</div>';
  $('#friendBadge').textContent = on;
}

/* ================= quick menu ================= */
function renderQuick() {
  const p = activeProfile();
  $('#quickInner').innerHTML = `
    <div class="qm-top">
      <div class="qm-user"><div class="avatar">${avatarSVG(p.avatar, p.accent)}</div><div><div class="qm-name">${esc(p.name)}</div><div class="qm-sub">NoxuraFluxOS 8.6</div></div></div>
      <div class="qm-sub" id="qmClock"></div>
    </div>
    <div class="qm-row">
      <button class="qbtn" data-f data-default data-action="qm-home">${esc(t('home'))}</button>
      <button class="qbtn" data-f data-action="qm-friends">${esc(t('friends'))}</button>
      <button class="qbtn" data-f data-action="qm-settings">${esc(t('settings'))}</button>
      <button class="qbtn" data-f data-action="qm-full">Vollbild</button>
      <div class="qm-vol" data-f data-slider="vol"><span class="lab">Lautstärke</span><div class="volbar"><i style="width:${S.vol}%"></i></div><span class="vlabel">${S.vol}%</span></div>
      <button class="qbtn danger2" data-f data-action="qm-reset">Neustart</button>
    </div>`;
  tickClock();
}
function openQuick() { if (!qmOpen()) { returnEl = focusEl; renderQuick(); $('#quickMenu').classList.add('open'); placeFocus(); } }
function closeQuick() { if (qmOpen()) { $('#quickMenu').classList.remove('open'); closeOverlay(); } }
function openFriends() {
  if (friendsOpen()) return;
  returnEl = focusEl;
  renderFriends();
  $('#friendsPanel').classList.add('open');
  placeFocus();
}
function closeFriends() { if (friendsOpen()) { $('#friendsPanel').classList.remove('open'); closeOverlay(); } }

/* ================= dialog ================= */
let dlgCb = null;
function openDialog(o) {
  returnEl = focusEl;
  $('#dlgKicker').textContent = o.kicker || '';
  $('#dlgTitle').textContent = o.title;
  $('#dlgBody').innerHTML = o.body || '';
  $('#dlgActions').innerHTML = o.buttons.map((b, i) =>
    `<button class="btn ${b.cls || ''}" data-f data-action="dlg-result" data-val="${i}"${i === (o.def ?? 0) ? ' data-default' : ''}>${esc(b.label)}</button>`).join('');
  dlgCb = o.cb || null;
  $('#dialogLayer').classList.add('open');
  placeFocus();
}
function closeDialog(i) {
  if (!dialogOpen()) return;
  $('#dialogLayer').classList.remove('open');
  const cb = dlgCb; dlgCb = null;
  sfx(i >= 0 ? 'ok' : 'back');
  if (cb) cb(i);
  closeOverlay();
}

/* ================= fullscreen ================= */
function toggleFS() {
  const d = document;
  try {
    if (!d.fullscreenElement) { const p = d.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => toast('Vollbild nicht verfügbar')); }
    else if (d.exitFullscreen) d.exitFullscreen();
  } catch (e) { toast('Vollbild nicht verfügbar'); }
}

/* ================= range helper ================= */
function rangeAdjust(el, dir) {
  const max = +el.max || 100, step = +el.step || 1;
  el.value = clamp(+el.value + dir * step, +el.min || 0, max);
  el.dispatchEvent(new Event('input', { bubbles: true }));
}

/* ================= actions ================= */
const ACT = {
  'boot-skip': () => skipBoot(),
  choose(el) {
    const k = el.dataset.key, o = holder(k);
    o[k] = coerce(el.dataset.val);
    save(); applyPrefs();
    rerender(refresh);
  },
  toggle(el) {
    const k = el.dataset.key, o = holder(k);
    o[k] = !o[k];
    save(); applyPrefs();
    if (k === 'sound' && o[k]) sfx('ok');
    rerender(refresh);
  },
  range(el) {
    const k = el.dataset.key, o = holder(k);
    o[k] = +el.value;
    el.style.setProperty('--p', ((el.value - el.min) / (el.max - el.min) * 100) + '%');
    const lbl = $(`[data-lbl="${k}"]`);
    if (lbl) lbl.textContent = el.value + (el.dataset.unit || '');
    if (k === 'vol') { updateVolUI(); }
    save(); applyPrefs();
  },
  'pad-vibrate': () => {
    if (!S.prefs.vib) return toast('Vibration ist deaktiviert');
    const gp = navigator.getGamepads ? [...navigator.getGamepads()].find(Boolean) : null;
    const va = gp && gp.vibrationActuator;
    if (!va) return toast('Vibration wird nicht unterstützt');
    va.playEffect('dual-rumble', { startDelay: 0, duration: 380, weakMagnitude: .5, strongMagnitude: .9 }).catch(() => {});
  },
  'sound-test': () => { sfx('nav'); setTimeout(() => sfx('ok'), 230); setTimeout(() => sfx('back'), 460); },
  'rename-draft': () => {
    const n = prompt('Profilname', setupDraft.name || '');
    if (n !== null) { setupDraft.name = n.trim().slice(0, 16); rerender(renderSetup); }
  },
  'set-avatar': el => { setupDraft.avatar = +el.dataset.val; rerender(renderSetup); },
  'set-accent': el => {
    const c = el.dataset.val;
    if (curView === 'setup') { setupDraft.accent = c; applyAccent(c); rerender(renderSetup); }
    else { const p = activeProfile(); if (p.id) { p.accent = c; save(); applyAccent(c); rerender(refresh); } }
  },
  'setup-back': () => {
    if (setupIdx > 0) { setupIdx--; rerender(renderSetup); }
    else if (setupSeq.length === 4) sfx('err');
    else goBack();
  },
  'setup-next': () => {
    if (setupIdx < setupSeq.length - 1) { setupIdx++; rerender(renderSetup); }
    else finishSetup();
  },
  'select-profile': el => { S.active = el.dataset.id; save(); go('home', { reset: true }); },
  'profiles-add': () => startSetup(false),
  'open-profiles': () => go('profiles'),
  'profile-switch': () => go('profiles'),
  tab: el => {
    S.tab = el.dataset.val; save();
    rerender(renderHome);
  },
  'open-store': () => openStore(),
  'open-gallery': () => go('gallery'),
  'open-library': () => { libDraft = null; go('library'); },
  'open-settings': () => go('settings'),
  'open-friends': () => openFriends(),
  'open-search': () => {
    const q = prompt('Spiel suchen');
    if (!q || !q.trim()) return;
    const id = Object.keys(CATALOG).find(k => CATALOG[k].name.toLowerCase().includes(q.trim().toLowerCase()));
    if (id && S.library.includes(id)) go('game', { id });
    else if (id) go('detail', { id });
    else toast('Keine Treffer');
  },
  'store-cat': el => { S.storeCat = el.dataset.val; save(); rerender(renderStore); },
  'open-detail': el => go('detail', { id: el.dataset.id }),
  'open-game': el => go('game', { id: el.dataset.id }),
  'game-tab': el => { S.gameTab = el.dataset.val; save(); rerender(renderGame); },
  launch: el => launchGame(el.dataset.id),
  'game-add': el => {
    if (!S.library.includes(el.dataset.id)) S.library.push(el.dataset.id);
    save(); toast('Zum Homescreen hinzugefügt');
    rerender(renderGame);
  },
  'game-remove': el => {
    S.library = S.library.filter(x => x !== el.dataset.id);
    save(); toast('Vom Homescreen entfernt');
    goBack();
  },
  'saves-clear': el => openDialog({
    kicker: 'Speicherdaten', title: 'Speicherdaten löschen?', body: 'Alle Spielstände dieses Spiels werden dauerhaft entfernt.', def: 1,
    buttons: [{ label: 'Löschen', cls: 'danger' }, { label: t('back') }],
    cb: i => { if (i === 0) { delete S.last[el.dataset.id]; S.play[el.dataset.id] = 0; save(); toast('Speicherdaten gelöscht'); rerender(renderGame); } }
  }),
  trailer: () => toast('Trailer ist in dieser Vorschau nicht verfügbar'),
  noop: () => { sfx('err'); toast(t('unavailable')); },
  back: () => goBack(),
  'toast-media': () => toast('Medien-Apps folgen in einem Update'),
  'lib-toggle': el => {
    const id = el.dataset.id, i = libDraft.indexOf(id);
    i >= 0 ? libDraft.splice(i, 1) : libDraft.push(id);
    rerender(renderLibrary);
  },
  'lib-custom': () => {
    const n = prompt('Name des Spiels');
    if (!n || !n.trim()) return;
    const id = 'custom-' + uid();
    const hue = Math.floor(Math.random() * 360);
    CATALOG[id] = { name: n.trim().slice(0, 32), genre: 'Eigen', demo: true, desc: 'Eigener Eintrag ohne Beschreibung.', art: `radial-gradient(60% 60% at 50% 30%,hsl(${hue} 70% 60%) 0,transparent 60%),linear-gradient(160deg,#0b1430,#03050e)`, meta: { dev: 'Eigen', ver: '–', size: '–', age: '–', rel: '–' }, req: rq('–', '–', '–', '–') };
    S.custom[id] = CATALOG[id];
    libDraft.push(id); save();
    rerender(renderLibrary);
  },
  'lib-test': () => { sfx('ok'); toast('Test-Start erfolgreich'); },
  'lib-cancel': () => { libDraft = null; goBack(); },
  'lib-apply': () => { S.library = [...libDraft]; libDraft = null; save(); go('home', { reset: true }); toast('Homescreen aktualisiert'); },
  'shot-take': () => { takeShot(); rerender(renderGallery); },
  'shot-open': el => {
    const idx = +el.dataset.val;
    openDialog({
      kicker: 'Capture', title: 'Screenshot löschen?', body: 'Dieser Capture wird dauerhaft entfernt.', def: 1,
      buttons: [{ label: 'Löschen', cls: 'danger' }, { label: t('back') }],
      cb: i => { if (i === 0) { S.captures.splice(idx, 1); save(); rerender(renderGallery); } }
    });
  },
  'set-section': el => { S.section = el.dataset.val; save(); rerender(renderSettings); },
  fullscreen: () => toggleFS(),
  'rename-profile': () => {
    const p = activeProfile(); if (!p.id) return;
    const n = prompt('Profilname', p.name);
    if (n && n.trim()) { p.name = n.trim().slice(0, 16); save(); rerender(refresh); }
  },
  'reset-all': () => openDialog({
    kicker: 'Reset', title: 'Alles zurücksetzen?', body: 'Profile, Einstellungen, Bibliothek und Captures werden entfernt.', def: 1,
    buttons: [{ label: 'Zurücksetzen', cls: 'danger' }, { label: t('back') }],
    cb: i => { if (i === 0) { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); } }
  }),
  'qm-home': () => { closeQuick(); go('home', { reset: true }); },
  'qm-friends': () => { closeQuick(); openFriends(); },
  'qm-settings': () => { closeQuick(); go('settings'); },
  'qm-full': () => { closeQuick(); toggleFS(); },
  'qm-reset': () => {
    closeQuick();
    openDialog({
      kicker: 'System', title: 'Neu starten?', body: 'Die Oberfläche wird neu geladen.', def: 1,
      buttons: [{ label: 'Neustart', cls: 'danger' }, { label: t('back') }],
      cb: i => { if (i === 0) location.reload(); }
    });
  },
  'friend-add': () => {
    const n = prompt('Name des Freundes');
    if (!n || !n.trim()) return;
    S.friends.push({ id: uid(), n: n.trim().slice(0, 16), on: Math.random() > .5, g: '' });
    save(); rerender(renderFriends);
  },
  'friend-invite': el => {
    const id = el.dataset.id;
    if (S.party.includes(id)) S.party = S.party.filter(x => x !== id);
    else if (S.party.length >= 3) return toast('Party ist voll (max. 4)');
    else S.party.push(id);
    save(); rerender(renderFriends);
  },
  'close-friends': () => closeFriends(),
  'dlg-result': el => closeDialog(+el.dataset.val)
};
function coerce(v) {
  if (v === 'true') return true;
  if (v === 'false') return false;
  if (v !== '' && !isNaN(+v)) return +v;
  return v;
}
function refresh() { applyPrefs(); if (R[curView]) R[curView]({}); }
function activate(el) {
  const a = el.dataset.action;
  if (!a || !ACT[a]) return;
  if (a !== 'noop' && a !== 'range') sfx('ok');
  ACT[a](el);
}
const R = {
  boot: () => {}, setup: renderSetup, profiles: renderProfiles, home: renderHome, store: renderStore,
  detail: renderDetail, game: renderGame, library: renderLibrary, gallery: renderGallery, settings: renderSettings
};

/* ================= input: keyboard ================= */
const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'a', ' ': 'a', Escape: 'b', Backspace: 'b', x: 'x', X: 'x', y: 'y', Y: 'y', Home: 'start', m: 'start', M: 'start' };
document.addEventListener('keydown', e => {
  primeAudio();
  if (e.key === 'Tab') { e.preventDefault(); moveSeq(e.shiftKey ? -1 : 1); return; }
  const b = KEYMAP[e.key];
  if (!b) { if (curView === 'boot') skipBoot(); return; }
  if (e.target && e.target.type === 'range' && (b === 'left' || b === 'right')) { e.preventDefault(); rangeAdjust(e.target, b === 'right' ? 1 : -1); return; }
  e.preventDefault();
  handleBtn(b);
});
document.addEventListener('keyup', e => { if (e.key === ' ') e.preventDefault(); });
document.addEventListener('pointerdown', primeAudio, { once: false });

/* ================= input: gamepad ================= */
const BTN = { 0: 'a', 1: 'b', 2: 'x', 3: 'y', 4: 'lb', 5: 'rb', 8: 'select', 9: 'start', 16: 'home' };
const BTN_LABEL = { 0: 'A', 1: 'B', 2: 'X', 3: 'Y', 4: 'LB', 5: 'RB', 8: 'Select', 9: 'Start', 12: 'Oben', 13: 'Unten', 14: 'Links', 15: 'Rechts', 16: 'Home' };
const DIRMAP = [[12, 'up'], [13, 'down'], [14, 'left'], [15, 'right']];
const prevPad = {}, repeatAt = {};
let lastPad = '';
function pollPads() {
  const now = performance.now();
  const gps = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
  const names = [];
  const thr = (S.prefs.dz || 20) / 100 + .3;
  for (const gp of gps) {
    const prev = prevPad[gp.index] || { btn: [], dir: {} };
    const btn = gp.buttons.map(b => b.pressed);
    const dir = {};
    DIRMAP.forEach(([i, d]) => { if (gp.buttons[i] && gp.buttons[i].pressed) dir[d] = true; });
    const ax = gp.axes || [];
    if ((ax[0] || 0) > thr) dir.right = true;
    if ((ax[0] || 0) < -thr) dir.left = true;
    if ((ax[1] || 0) > thr) dir.down = true;
    if ((ax[1] || 0) < -thr) dir.up = true;
    btn.forEach((p, i) => {
      if (p) names.push(BTN_LABEL[i] || String(i));
      if (p && !prev.btn[i] && BTN[i]) { primeAudio(); handleBtn(BTN[i]); }
    });
    ['up', 'down', 'left', 'right'].forEach(d => {
      const k = gp.index + d;
      if (dir[d]) {
        if (!prev.dir[d]) { handleBtn(d); repeatAt[k] = now + 350; }
        else if (now >= (repeatAt[k] || 0)) { handleBtn(d); repeatAt[k] = now + 130; }
      }
    });
    prevPad[gp.index] = { btn, dir };
  }
  const txt = names.length ? names.join(' + ') : 'Keine Eingabe';
  if (txt !== lastPad) { lastPad = txt; const ps = $('#padState'); if (ps) ps.textContent = txt; }
}
window.addEventListener('gamepadconnected', e => { primeAudio(); sfx('ok'); toast('Controller verbunden'); updateHints(); });
window.addEventListener('gamepaddisconnected', () => { toast('Controller getrennt'); updateHints(); });

/* ================= input: pointer ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-f],[data-action]');
  if (!el || el.tagName === 'INPUT') return;
  if (!scopeRoot().contains(el)) return;
  if (el.hasAttribute('data-f')) setFocus(el, true);
  if (el.dataset.action) activate(el);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.tagName === 'INPUT' && el.type === 'range' && el.dataset.action && ACT[el.dataset.action]) ACT[el.dataset.action](el);
});

/* ================= central button handler ================= */
function handleBtn(b) {
  if (curView === 'boot') { skipBoot(); return; }
  if (b === 'b') {
    if (dialogOpen()) return closeDialog(-1);
    if (qmOpen()) return closeQuick();
    if (friendsOpen()) return closeFriends();
    if (curView === 'setup') return ACT['setup-back']();
    if (curView !== 'home') return goBack();
    return;
  }
  if (b === 'start' || b === 'y') {
    if (dialogOpen()) return;
    if (qmOpen()) return closeQuick();
    if (friendsOpen()) return closeFriends();
    openQuick();
    return;
  }
  if (b === 'lb' || b === 'rb') {
    if (curView === 'home' && !overlayOpen()) {
      const order = ['games', 'media'];
      S.tab = order[(order.indexOf(S.tab) + 1) % order.length]; save();
      rerender(renderHome);
    }
    return;
  }
  if (b === 'x') {
    if (curView === 'home' && !overlayOpen()) ACT['open-search']();
    return;
  }
  if (b === 'a') { if (focusEl) activate(focusEl); return; }
  if (b === 'down' && curView === 'home' && !overlayOpen() && focusEl && focusEl.dataset.action === 'open-game') {
    go('game', { id: focusEl.dataset.id });
    return;
  }
  if (b === 'up' && curView === 'game' && focusEl && focusEl.hasAttribute('data-top')) { goBack(); return; }
  if (b === 'up' || b === 'down' || b === 'left' || b === 'right') {
    if (focusEl && focusEl.type === 'range' && (b === 'left' || b === 'right')) { rangeAdjust(focusEl, b === 'right' ? 1 : -1); return; }
    if (focusEl && focusEl.dataset.slider === 'vol' && (b === 'left' || b === 'right')) { volStep(b === 'right' ? 1 : -1); return; }
    move(b);
  }
}

/* ================= init ================= */
function init() {
  applyPrefs();
  applyAccent(activeProfile().accent);
  resizeBG();
  window.addEventListener('resize', resizeBG);
  tickClock(); setInterval(tickClock, 1000);
  if (navigator.getBattery) {
    navigator.getBattery().then(b => {
      const up = () => { $('#batPct').textContent = Math.round(b.level * 100) + '%'; };
      up(); b.addEventListener('levelchange', up);
    }).catch(() => {});
  }
  const loop = now => { drawBG(now); pollPads(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  startBoot();
}
init();
})();
</script>
