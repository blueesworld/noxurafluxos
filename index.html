<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NoxuraFluxOS 8.5</title>
<style>
:root{
  --accent:#2f8cff;--accent-2:#4de1ff;--accent-soft:#6fb8ff;
  --danger:#FF3B30;--ok:#46e39b;--muted:#9db0d2;--text:#eaf1ff;
  --stroke:rgba(150,190,255,.18);--stroke-strong:rgba(170,210,255,.42);
  --glass:rgba(16,24,46,.55);--ui:1;--hints-h:2.5rem;--frame:0px;--radius:1.1rem;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(clamp(10px,1.12vh + .36vw,18px) * var(--ui));height:100%;background:#03050e}
body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI","SF Pro Display",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--text);user-select:none;touch-action:manipulation;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
svg{display:block}
#app{position:fixed;inset:var(--frame);overflow:hidden;background:linear-gradient(180deg,#04060f 0%,#050a16 50%,#03050e 100%)}
#bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.05;z-index:1;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.6'/></svg>")}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(115% 90% at 50% 45%,transparent 45%,rgba(0,2,10,.78) 100%)}

/* ---------- views ---------- */
.view{position:absolute;left:0;right:0;top:0;bottom:var(--hints-h);display:none;flex-direction:column;min-width:0;z-index:5;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.view.active{display:flex;animation:viewIn .38s cubic-bezier(.22,.68,0,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(.9rem)}to{opacity:1;transform:none}}

/* ---------- focus ---------- */
[data-f]{position:relative;outline:none}
[data-f].is-focus::after{content:"";position:absolute;inset:-.22rem;border-radius:inherit;pointer-events:none;border:.14rem solid var(--accent);box-shadow:0 0 0 .06rem rgba(255,255,255,.55),0 0 1.6rem rgba(47,140,255,.75),0 0 3.4rem rgba(77,225,255,.35);z-index:4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.62rem 1.35rem;border-radius:99rem;font-size:.92rem;font-weight:600;background:rgba(140,180,255,.1);border:.06rem solid var(--stroke);color:#dbe8ff;transition:transform .13s,background .18s,box-shadow .18s}
.btn.is-focus{transform:translateY(-.1rem) scale(1.045);background:rgba(140,180,255,.2)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#04101f;border-color:transparent;font-weight:800}
.btn.danger{background:rgba(255,59,48,.16);border-color:rgba(255,59,48,.45);color:#ffb3ae}
.btn.ghost{background:rgba(255,255,255,.05)}
.btn:disabled{opacity:.5}
.chip{padding:.34rem .9rem;border-radius:99rem;font-size:.68rem;font-weight:600;background:rgba(140,180,255,.08);border:.05rem solid var(--stroke);color:#b9cbe9}
.chip.on{background:rgba(255,255,255,.14);color:#fff}
.chip.is-focus{background:var(--accent);color:#05101f}
.chips{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.iconbtn{width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;color:#cfdcf5;background:rgba(10,18,36,.42);transition:background .18s,color .18s,transform .15s;position:relative}
.iconbtn svg{width:1.05rem;height:1.05rem}
.iconbtn.is-focus{background:#fff;color:#06101f;transform:scale(1.08)}
.badge{position:absolute;top:-.1rem;right:-.1rem;min-width:1rem;height:1rem;border-radius:99rem;background:var(--ok);color:#032015;font-size:.56rem;font-weight:800;display:grid;place-items:center;padding:0 .22rem;box-shadow:0 0 0 .14rem #06101f}
.avatar{border-radius:50%;overflow:hidden;background:#0b1226;display:grid;place-items:center;flex:none}
.avatar svg{width:100%;height:100%}
.empty{padding:2rem;color:#7d93b8;font-size:.8rem;text-align:center}
.sec-title{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:#8fa3c4;font-weight:700;margin:1.2rem 0 .7rem}
.kv{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.6rem 0;border-bottom:.05rem solid rgba(150,190,255,.1);font-size:.76rem}
.kv b{color:#8fa3c4;font-weight:500}
.kv span{font-weight:600;text-align:right}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem;align-items:center}
.pill{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .7rem;border-radius:99rem;font-size:.68rem;font-weight:700;background:rgba(70,227,155,.14);color:#9df5c9;border:.06rem solid rgba(70,227,155,.35)}
.pill.off{background:rgba(255,255,255,.06);color:#9db0d2;border-color:rgba(255,255,255,.1)}
.range-row{display:flex;align-items:center;gap:1rem;width:100%;margin-top:.6rem}
input[type=range]{-webkit-appearance:none;appearance:none;height:.3rem;border-radius:99rem;background:linear-gradient(90deg,var(--accent) var(--p,50%),rgba(160,200,255,.18) var(--p,50%));flex:1;max-width:26rem;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.2rem;height:1.2rem;border-radius:50%;background:#fff;box-shadow:0 0 1rem var(--accent),0 0 .3rem rgba(0,0,0,.5);cursor:pointer}
input[type=range]::-moz-range-thumb{width:1.2rem;height:1.2rem;border:0;border-radius:50%;background:#fff;box-shadow:0 0 1rem var(--accent)}
input[type=range].is-focus{box-shadow:0 0 0 .14rem var(--accent)}
.swatches{display:flex;gap:.6rem;flex-wrap:wrap}
.sw{width:2rem;height:2rem;border-radius:50%;border:.1rem solid rgba(255,255,255,.25);transition:transform .14s}
.sw.is-focus{transform:scale(1.18)}
.sw.sel{box-shadow:0 0 0 .16rem #fff}
.avatars{display:flex;flex-wrap:wrap;gap:.7rem}
.av{width:3.4rem;height:3.4rem;border-radius:50%;display:grid;place-items:center;border:.09rem solid var(--stroke);background:#0b1226;overflow:hidden;transition:transform .14s}
.av svg{width:100%;height:100%}
.av.sel{border-color:var(--accent);box-shadow:0 0 1.2rem rgba(47,140,255,.65)}
.av.is-focus{transform:scale(1.1)}
.controller-vis{display:flex;align-items:center;gap:1.4rem;padding:1rem 1.4rem;border-radius:.9rem;background:var(--glass);border:.06rem solid var(--stroke);width:100%}
.pad-state{font-family:ui-monospace,Consolas,monospace;font-size:.72rem;color:#9fc4ff;margin-top:.4rem;min-height:1.2rem;letter-spacing:.05em}
.pad-live{font-size:.74rem;color:var(--muted);margin-top:.3rem}
.seg{display:inline-flex;background:rgba(255,255,255,.06);border-radius:99rem;padding:.18rem;gap:.15rem;margin-top:.5rem}
.seg button{padding:.34rem .8rem;border-radius:99rem;font-size:.7rem;font-weight:600;color:#a9bcdb}
.seg button.on{background:rgba(255,255,255,.16);color:#fff}
.seg button.is-focus{background:var(--accent);color:#04101f}
.toggle{width:2.6rem;height:1.4rem;border-radius:99rem;background:rgba(255,255,255,.12);position:relative;transition:background .2s;flex:none}
.toggle i{position:absolute;top:.13rem;left:.15rem;width:1.14rem;height:1.14rem;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.toggle.on i{transform:translateX(1.2rem);background:#04101f}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.72rem .85rem;border-radius:.6rem;background:rgba(255,255,255,.04);margin-bottom:.55rem;border:.06rem solid transparent;width:100%;text-align:left}
.switchrow.is-focus{background:rgba(47,140,255,.18);border-color:var(--accent)}
.switchrow .tl{font-size:.78rem;font-weight:600}
.switchrow .ts{font-size:.65rem;color:#8fa3c4;margin-top:.15rem}

/* ---------- hints ---------- */
#hints{position:absolute;left:0;right:0;bottom:0;height:var(--hints-h);display:flex;align-items:center;justify-content:space-between;padding:0 1.6rem;font-size:.72rem;color:#c3d3ee;pointer-events:none;z-index:60;background:linear-gradient(0deg,rgba(2,4,12,.86),rgba(2,4,12,0))}
#hints .hgroup{display:flex;align-items:center;gap:1.1rem;flex-wrap:wrap}
.hitem{display:inline-flex;align-items:center;white-space:nowrap}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:1.55rem;height:1.55rem;padding:0 .35rem;margin-right:.4rem;border-radius:.5rem;border:.07rem solid rgba(180,210,255,.5);background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.03));font-size:.7rem;font-weight:800;color:#fff;line-height:1}
.key.round{border-radius:50%}
.key.x{color:#8fd4ff;border-color:rgba(143,212,255,.6)}
.key.o{color:#ff9d9d;border-color:rgba(255,157,157,.6)}
.key.t{color:#9dffe0;border-color:rgba(157,255,224,.6)}

/* ---------- boot ---------- */
#view-boot{align-items:center;justify-content:center}
.boot-logo{display:flex;flex-direction:column;align-items:center;gap:1.1rem}
.boot-mark{position:relative;font-size:clamp(2.6rem,7vw,5.4rem);font-weight:800;letter-spacing:.42em;padding-left:.42em;overflow:hidden;background:linear-gradient(180deg,#ffffff,#b9d8ff 55%,#5f9bff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:markIn 1.5s cubic-bezier(.16,1,.3,1) both;filter:drop-shadow(0 0 1.6rem rgba(63,140,255,.55))}
.boot-mark .shine{position:absolute;top:0;left:-60%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);filter:blur(.4rem);animation:shine 2.4s 1s ease-in-out infinite}
@keyframes shine{0%{left:-60%}60%{left:120%}100%{left:120%}}
@keyframes markIn{from{opacity:0;letter-spacing:.9em;transform:scale(.94)}to{opacity:1;letter-spacing:.42em;transform:none}}
.boot-os{font-size:.95rem;letter-spacing:.5em;color:#9fc4ff;opacity:0;animation:viewIn .8s .9s both;padding-left:.5em}
.boot-os b{color:#fff;font-weight:800}
.boot-bar{width:min(22rem,52vw);height:.18rem;border-radius:99rem;overflow:hidden;background:rgba(160,200,255,.16);margin-top:1rem;opacity:0;animation:viewIn .6s 1.2s both}
.boot-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 1rem var(--accent);transition:width 3s linear}
.boot-hint{margin-top:1.6rem;font-size:.74rem;color:#7d93b8;opacity:0;animation:viewIn .6s 1.8s both}
.boot-hint.is-focus{color:#fff}

/* ---------- setup ---------- */
#view-setup{padding:2.2rem 3.4rem}
.setup-shell{display:flex;flex-direction:column;height:100%;gap:1.1rem}
.setup-head{display:flex;flex-direction:column;gap:.5rem}
.setup-step{font-size:.72rem;letter-spacing:.22em;color:var(--accent-soft);font-weight:700}
.setup-title{font-size:1.9rem;font-weight:700;margin:0}
.setup-sub{margin:0;color:var(--muted);font-size:.86rem;max-width:60ch;line-height:1.5}
.setup-body{flex:1;min-height:0;overflow-y:auto;padding:.4rem .2rem;display:flex;flex-wrap:wrap;gap:.9rem;align-content:flex-start;scrollbar-width:none}
.setup-body>*{flex:0 0 auto}
.setup-foot{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.opt{position:relative;display:flex;flex-direction:column;gap:.3rem;justify-content:center;padding:1rem 1.5rem;border-radius:.9rem;min-width:10rem;background:var(--glass);border:.06rem solid var(--stroke);transition:transform .14s,background .18s}
.opt b{font-size:1rem;font-weight:700}
.opt span{font-size:.72rem;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:rgba(47,140,255,.16)}
.opt.sel::before{content:"✓";position:absolute;top:.45rem;right:.7rem;font-size:.7rem;color:var(--accent-2)}
.opt.is-focus{transform:translateY(-.18rem) scale(1.03);background:rgba(47,140,255,.14)}
.calib-frame{width:min(40rem,100%);height:9rem;border-radius:.8rem;position:relative;border:.1rem dashed rgba(160,200,255,.4);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.78rem;background:linear-gradient(90deg,rgba(47,140,255,.06),rgba(77,225,255,.03))}
.calib-frame span{position:absolute;inset:1rem;border:.07rem solid rgba(170,210,255,.25);border-radius:.5rem}
.stepper{display:flex;align-items:center;gap:1rem}
.stepper .val{min-width:5rem;text-align:center;font-weight:800;font-size:1.05rem}

/* ---------- profiles ---------- */
#view-profiles{align-items:center;justify-content:center;gap:2rem}
.profiles-title{font-size:1.75rem;font-weight:300;letter-spacing:.12em;text-transform:uppercase;color:#dbe8ff}
.profiles-row{display:flex;gap:2.2rem;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.profile-card{display:flex;flex-direction:column;align-items:center;gap:.7rem;padding:1rem;border-radius:1rem;width:9rem;transition:transform .16s,background .18s}
.profile-card .big{width:5.6rem;height:5.6rem;border-radius:50%;overflow:hidden;border:.12rem solid transparent;transition:border-color .2s,box-shadow .2s}
.profile-card .big svg{width:100%;height:100%}
.profile-card .nm{font-size:.92rem;font-weight:600;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-card .lv{font-size:.68rem;color:var(--muted)}
.profile-card.add .big{display:grid;place-items:center;border:.1rem dashed rgba(170,210,255,.45);font-size:1.8rem;color:#7f9cc4}
.profile-card.is-focus{transform:translateY(-.4rem) scale(1.05);background:rgba(255,255,255,.05)}
.profile-card.is-focus .big{border-color:var(--accent);box-shadow:0 0 1.8rem rgba(47,140,255,.6)}

/* ---------- home ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.85rem 1.7rem .6rem;position:relative;z-index:20}
.top-left{display:flex;align-items:center;gap:1.5rem;min-width:0}
.top-right{display:flex;align-items:center;gap:.5rem}
.profile-chip{display:flex;align-items:center;gap:.65rem;padding:.3rem .9rem .3rem .35rem;border-radius:99rem;background:rgba(10,18,36,.5);border:.06rem solid transparent;transition:border-color .2s,background .2s}
.profile-chip .avatar{width:2.2rem;height:2.2rem}
.profile-chip.is-focus{border-color:var(--accent);background:rgba(47,140,255,.14)}
.pname{font-size:.86rem;font-weight:700;line-height:1.15;max-width:11rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plvl{font-size:.64rem;color:var(--muted);display:flex;align-items:center;gap:.25rem}
.trophy{color:#ffd479}
.tabs{display:flex;gap:.35rem;background:rgba(8,14,28,.42);padding:.22rem;border-radius:99rem;border:.05rem solid rgba(150,190,255,.12)}
.tab{padding:.42rem 1.15rem;border-radius:99rem;font-size:.8rem;font-weight:600;color:#a9bcdb;transition:background .2s,color .2s}
.tab.on{background:rgba(255,255,255,.13);color:#fff}
.tab.is-focus{background:var(--accent);color:#04101f}
.status{display:flex;align-items:center;gap:.7rem;margin-left:.5rem;color:#cfdcf5;font-size:.76rem}
.status svg{width:1rem;height:1rem}
#clock{font-variant-numeric:tabular-nums;font-weight:600}
.batwrap{display:flex;align-items:center;gap:.25rem;font-size:.66rem}
#view-home{overflow:hidden}
#heroArt{position:absolute;inset:0;z-index:0;opacity:.5;transition:background .4s}
.hero{position:relative;z-index:5;padding:0 1.9rem;display:flex;flex-direction:column;gap:.28rem;pointer-events:none;margin-top:.2rem;min-height:4.6rem}
.hero-kicker{font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--accent-soft);font-weight:700}
.hero-title{font-size:clamp(1.35rem,2.9vw,2.5rem);font-weight:700;margin:0;line-height:1.06;text-shadow:0 0 .9rem rgba(0,0,0,.45)}
.hero-sub{font-size:.76rem;color:#c2d2ee;margin:0;max-width:52ch;line-height:1.45}
.rail-wrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:.35rem;padding:.4rem 0 .2rem;position:relative;z-index:10}
.rail-label{padding:0 1.9rem;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:#8497b8;font-weight:700}
.rail{display:flex;align-items:center;gap:1rem;padding:1.1rem 1.9rem 1.3rem;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;scrollbar-width:none;min-height:0}
.rail::-webkit-scrollbar{display:none}
.tile{position:relative;flex:none;border-radius:.95rem;height:clamp(8rem,40vh,23rem);aspect-ratio:3/4;background:#0a1226;border:.06rem solid rgba(170,210,255,.14);transition:transform .2s cubic-bezier(.22,.68,0,1),border-color .2s;box-shadow:0 .5rem 1.6rem rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:flex-end}
.tile .art{position:absolute;inset:0;background-size:cover;background-position:center;border-radius:inherit;z-index:0}
.tile .art::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(0deg,rgba(2,5,14,.9) 4%,rgba(2,5,14,.15) 48%,rgba(2,5,14,0) 72%)}
.tile .tmeta{position:relative;z-index:2;padding:.75rem .8rem;display:flex;flex-direction:column;gap:.15rem}
.tile .tname{font-size:.78rem;font-weight:700;line-height:1.2;text-shadow:0 0 .4rem rgba(0,0,0,.8)}
.tile .tsub{font-size:.6rem;color:#b7c9e6;letter-spacing:.06em;text-transform:uppercase}
.tile.is-focus{transform:translateY(-.55rem) scale(1.055);border-color:rgba(255,255,255,.5)}
.tile .badge-sys{position:absolute;top:.5rem;left:.5rem;z-index:2;font-size:.52rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;padding:.18rem .45rem;border-radius:.3rem;background:rgba(4,10,22,.72);border:.05rem solid rgba(170,210,255,.28);color:#cfe2ff}
.tile.add{display:grid;place-items:center;background:linear-gradient(160deg,rgba(30,48,88,.5),rgba(9,16,32,.75));border-style:dashed;border-color:rgba(170,210,255,.3)}
.tile.add .plus{font-size:2rem;font-weight:200;color:#a9c5ee;line-height:1}
.tile.add .label{margin-top:.55rem;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:#b8caE8;text-align:center;padding:0 .8rem}

/* ---------- store ---------- */
.store-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 1.9rem .2rem;flex-wrap:wrap}
.store-title{font-size:1.5rem;font-weight:700;margin:0}
.store-title span{color:var(--accent-2);font-weight:400}
.store-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 1.9rem 1.4rem;scrollbar-width:none}
.store-body::-webkit-scrollbar{display:none}
.hero-banner{position:relative;border-radius:1.1rem;overflow:hidden;height:clamp(9rem,32vh,18rem);display:flex;align-items:flex-end;padding:1.2rem 1.5rem;margin:.6rem 0 1rem;border:.06rem solid var(--stroke)}
.hb-art{position:absolute;inset:0;background-size:cover;background-position:center}
.hb-art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,6,16,.92) 8%,rgba(3,6,16,.15) 70%)}
.hb-info{position:relative;z-index:2;display:flex;flex-direction:column;gap:.35rem;max-width:60%}
.hb-kicker{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-2);font-weight:800}
.hb-title{font-size:1.5rem;font-weight:800;margin:0;line-height:1.1}
.hb-sub{font-size:.74rem;color:#c0d0ea;margin:0}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(8rem,15vw,13rem),1fr));gap:1rem}
.card{border-radius:.85rem;background:rgba(12,20,38,.66);border:.06rem solid var(--stroke);transition:transform .18s,border-color .2s}
.c-art{position:relative;aspect-ratio:3/4;background-size:cover;background-position:center;border-radius:.85rem .85rem 0 0}
.lock{position:absolute;top:.45rem;right:.45rem;font-size:.5rem;letter-spacing:.1em;font-weight:800;padding:.16rem .38rem;border-radius:.28rem;background:rgba(255,59,48,.85);color:#fff}
.c-meta{padding:.6rem .65rem .7rem;display:flex;flex-direction:column;gap:.15rem}
.c-name{font-size:.76rem;font-weight:700;line-height:1.2}
.c-tag{font-size:.6rem;color:#9db0d2;letter-spacing:.05em;text-transform:uppercase}
.card.is-focus{transform:translateY(-.32rem) scale(1.035);border-color:rgba(255,255,255,.42)}

/* ---------- detail ---------- */
#view-detail{padding:0}
.detail-wrap{display:flex;flex-direction:column;height:100%;min-height:0}
.detail-hero{position:relative;height:clamp(8rem,30vh,17rem);flex:none;overflow:hidden}
.d-art{position:absolute;inset:0;background-size:cover;background-position:center 30%}

/* ============ audio ============ */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d = .06, type = 'sine', vol = .06, slide = 0, delay = 0) {
  if (!S.sound) return;
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + d);
  const v = Math.max(vol * (S.vol / 100), .0002);
  g.gain.setValueAtTime(.0001, t0);
  g.gain.exponentialRampToValueAtTime(v, t0 + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + d + .02);
}
const SFX = {
  tick: () => tone(900, .035, 'sine', .035),
  ok: () => tone(660, .08, 'triangle', .07, 990),
  back: () => tone(520, .09, 'triangle', .06, 340),
  err: () => tone(180, .14, 'square', .04),
  chime: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .35, 'sine', .07, 0, i * .12))
};
function sfx(n) { try { SFX[n] && SFX[n](); } catch (e) {} }

/* ============ background canvas ============ */
const bg = $('#bg'), bctx = bg.getContext('2d');
let W = 1, H = 1, DPR = 1;
function resizeBG() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = bg.width = Math.round(innerWidth * DPR);
  H = bg.height = Math.round(innerHeight * DPR);
}
const parts = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * .6 + .2, v: Math.random() * .0004 + .00008 }));
function drawBG(now) {
  bctx.clearRect(0, 0, W, H);
  for (let w = 0; w < 4; w++) {
    bctx.beginPath();
    for (let x = 0; x <= W; x += 12 * DPR) {
      const y = H * (.62 + w * .06)
        + Math.sin(x / W * 6 + now * .0006 + w) * H * .035 * (1 + w * .2)
        + Math.sin(x / W * 13 - now * .0009 + w * 2) * H * .012;
      x === 0 ? bctx.moveTo(x, y) : bctx.lineTo(x, y);
    }
    bctx.lineTo(W, H); bctx.lineTo(0, H); bctx.closePath();
    const g = bctx.createLinearGradient(0, H * .5, 0, H);
    g.addColorStop(0, `rgba(47,140,255,${.10 - w * .02})`);
    g.addColorStop(1, 'rgba(3,5,14,0)');
    bctx.fillStyle = g; bctx.fill();
  }
  parts.forEach(p => {
    p.y -= p.v * (1 + p.s);
    if (p.y < 0) { p.y = 1; p.x = Math.random(); }
    bctx.fillStyle = `rgba(120,220,255,${.15 + p.s * .35})`;
    bctx.beginPath();
    bctx.arc(p.x * W, p.y * H, p.s * 2.2 * DPR, 0, Math.PI * 2);
    bctx.fill();
  });
}

let curView = null, stack = [], focusEl = null, detailId = null, setupSeq = [0, 1, 2, 3, 4], setupIdx = 0, setupDraft = null, libDraft = null, dlgCb = null;
const dialogOpen = () => $('#dialogLayer').classList.contains('open');
const qmOpen = () => $('#quickMenu').classList.contains('open');
const friendsOpen = () => $('#friendsPanel').classList.contains('open');
function scopeRoot() {
  if (dialogOpen()) return $('#dialogLayer');
  if (qmOpen()) return $('#quickMenu');
  if (friendsOpen()) return $('#friendsPanel');
  return $('.view.active') || document.body;
}
function focusables(root = scopeRoot()) {
  return $$('[data-f]', root).filter(e => e.getClientRects().length && !e.disabled);
}
function clearFocus() { $$('.is-focus').forEach(e => e.classList.remove('is-focus')); focusEl = null; }
function setFocus(el, silent) {
  if (!el || el === focusEl) return;
  $$('.is-focus').forEach(e => e.classList.remove('is-focus'));
  focusEl = el; el.classList.add('is-focus');
  try { el.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' }); } catch (e) {}
  if (el.dataset.hero !== undefined) heroFor(el.dataset.hero);
  if (!silent) sfx('tick');
  updateHints();
}
function focusFirst() {
  clearFocus();
  const list = focusables();
  const t0 = list.find(e => e.hasAttribute('data-default')) || list[0];
  if (t0) setFocus(t0, true);
}
function ensureFocus() {
  const list = focusables();
  if (!focusEl || !list.includes(focusEl)) focusFirst();
}
function keyOf(el) { return [el.dataset.action || '', el.dataset.val || '', el.dataset.id || ''].join('|'); }
function rerender(fn) {
  const key = focusEl ? keyOf(focusEl) : '';
  clearFocus();
  fn();
  const list = focusables();
  const target = (key && list.find(e => keyOf(e) === key)) || list.find(e => e.hasAttribute('data-default')) || list[0];
  if (target) setFocus(target, true);
  updateHints();
}
function move(dir) {
  const list = focusables();
  if (!list.length) return;
  if (!focusEl || !list.includes(focusEl)) return setFocus(list[0]);
  const r = focusEl.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bs = Infinity;
  for (const el of list) {
    if (el === focusEl) continue;
    const q = el.getBoundingClientRect();
    const dx = (q.left + q.width / 2) - cx, dy = (q.top + q.height / 2) - cy;
    let prim, sec;
    if (dir === 'right') { if (dx <= 4) continue; prim = dx; sec = Math.abs(dy); }
    else if (dir === 'left') { if (dx >= -4) continue; prim = -dx; sec = Math.abs(dy); }
    else if (dir === 'down') { if (dy <= 4) continue; prim = dy; sec = Math.abs(dx); }
    else { if (dy >= -4) continue; prim = -dy; sec = Math.abs(dx); }
    const s = prim + sec * 2.2;
    if (s < bs) { bs = s; best = el; }
  }
  if (best) setFocus(best);
}
function moveSeq(dir) {
  const list = focusables();
  if (!list.length) return;
  const i = list.indexOf(focusEl);
  setFocus(list[(i + dir + list.length) % list.length]);
}

  go(p, { noPush: true });

function takeShot() {
  const c = document.createElement('canvas');
  c.width = 640; c.height = 360;
  const x = c.getContext('2d');
  x.drawImage(bg, 0, 0, 640, 360);
  x.fillStyle = 'rgba(0,0,0,.4)'; x.fillRect(0, 326, 640, 34);
  x.fillStyle = '#dbe8ff'; x.font = '14px sans-serif';
  x.fillText('NoxuraFluxOS 8.5 · ' + new Date().toLocaleString('de-DE'), 16, 348);
  const d = c.toDataURL('image/jpeg', .7);
  S.captures.unshift({ d, t: new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) });
  S.captures = S.captures.slice(0, 12);
  save(); sfx('ok'); toast('Screenshot gespeichert');
}

/* ============ fullscreen ============ */
function toggleFS() {
  const d = document;
  try {
    if (!d.fullscreenElement) { const p = d.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => toast('Vollbild nicht verfügbar')); }
    else if (d.exitFullscreen) d.exitFullscreen();
  } catch (e) { toast('Vollbild nicht verfügbar'); }
}

/* ============ hero/shot helpers ============ */
function rangeAdjust(el, dir) {
  const max = +el.max || 100, step = +el.step || 1;
  el.value = clamp(+el.value + dir * step, +el.min || 0, max);
  el.style.setProperty('--p', (el.value / max * 100) + '%');
  el.dispatchEvent(new Event('input', { bubbles: true }));
}

      kicker: 'Capture', title: 'Screenshot löschen?', body: 'Dieser Capture wird dauerhaft entfernt.', def: 1,
      buttons: [{ label: 'Löschen', cls: 'danger' }, { label: t('back') }],
      cb: i => { if (i === 0) { S.captures.splice(idx, 1); save(); rerender(renderGallery); } }
    });
  },
  'set-section': el => { S.section = el.dataset.val; save(); rerender(renderSettings); },
  'toggle-sound': () => { S.sound = !S.sound; save(); rerender(renderSettings); if (S.sound) sfx('ok'); },
  'vol-range': el => { S.vol = +el.value; save(); updateVolUI(); },
  'fullscreen': () => toggleFS(),
  'rename-profile': () => {
    const p = activeProfile(); if (!p.id) return;
    const n = prompt('Profilname', p.name);
    if (n && n.trim()) { p.name = n.trim().slice(0, 16); save(); rerender(renderSettings); }
  },
  'reset-all': () => openDialog({
    kicker: 'Reset', title: 'Alle Daten löschen?', body: 'Profile, Einstellungen, Bibliothek und Captures werden entfernt.', def: 1,
    buttons: [{ label: 'Zurücksetzen', cls: 'danger' }, { label: t('back') }],
    cb: i => { if (i === 0) { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); } }
  }),
  'qm-home': () => { closeQuick(); go('home', { reset: true }); },
  'qm-friends': () => { closeQuick(); openFriends(); },
  'qm-settings': () => { closeQuick(); go('settings'); },
  'qm-full': () => { closeQuick(); toggleFS(); },
  'qm-reset': () => {
    closeQuick();
    openDialog({
      kicker: 'System', title: 'Neustarten?', body: 'Die Oberfläche wird neu geladen. Ungespeicherte Änderungen gehen verloren.', def: 1,
      buttons: [{ label: 'Neustart', cls: 'danger' }, { label: t('back') }],
      cb: i => { if (i === 0) location.reload(); }
    });
  },
  'friend-add': () => {
    const n = prompt('Name des Freundes');
    if (!n || !n.trim()) return;
    S.friends.push({ id: uid(), n: n.trim().slice(0, 16), on: Math.random() > .5, g: '' });
    save(); rerender(renderFriends);
  },
  'friend-invite': el => {
    const id = el.dataset.id;
    if (S.party.includes(id)) S.party = S.party.filter(x => x !== id);
    else if (S.party.length >= 3) return toast('Party ist voll (max. 4)');
    else S.party.push(id);
    save(); rerender(renderFriends);
  },
  'close-friends': () => closeFriends(),
  'dlg-result': el => closeDialog(+el.dataset.val)
};
function activate(el) {
  const a = el.dataset.action;
  if (!a || !ACT[a]) return;
  if (a !== 'noop') sfx('ok');
  ACT[a](el);
}
const R = {
  boot: () => {},
  setup: renderSetup, profiles: renderProfiles, home: renderHome, store: renderStore,
  detail: renderDetail, library: renderLibrary, gallery: renderGallery, settings: renderSettings
};

/* ============ input: keyboard ============ */
const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'a', ' ': 'a', Escape: 'b', Backspace: 'b', x: 'x', X: 'x', y: 'y', Y: 'y', Home: 'start', m: 'start', M: 'start' };
document.addEventListener('keydown', e => {
  if (e.key === 'Tab') { e.preventDefault(); moveSeq(e.shiftKey ? -1 : 1); return; }
  const b = KEYMAP[e.key];
  if (!b) { if (curView === 'boot') skipBoot(); return; }
  e.preventDefault();
  handleBtn(b);
});
document.addEventListener('keyup', e => { if (e.key === ' ') e.preventDefault(); });

/* ============ input: gamepad ============ */
const BTN = { 0: 'a', 1: 'b', 2: 'x', 3: 'y', 4: 'lb', 5: 'rb', 8: 'select', 9: 'start', 16: 'home' };
const BTN_LABEL = { 0: 'A', 1: 'B', 2: 'X', 3: 'Y', 4: 'LB', 5: 'RB', 8: 'Select', 9: 'Start', 12: '↑', 13: '↓', 14: '←', 15: '→', 16: 'Home' };
const DIRMAP = [[12, 'up'], [13, 'down'], [14, 'left'], [15, 'right']];
const prevPad = {}, repeatAt = {};
let lastPad = '';
function pollPads() {
  const now = performance.now();
  const gps = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
  const names = [];
  for (const gp of gps) {
    const prev = prevPad[gp.index] || { btn: [], dir: {} };
    const btn = gp.buttons.map(b => b.pressed);
    const dir = {};
    DIRMAP.forEach(([i, d]) => { if (gp.buttons[i] && gp.buttons[i].pressed) dir[d] = true; });
    const ax = gp.axes || [];
    if ((ax[0] || 0) > .6) dir.right = true;
    if ((ax[0] || 0) < -.6) dir.left = true;
    if ((ax[1] || 0) > .6) dir.down = true;
    if ((ax[1] || 0) < -.6) dir.up = true;
    btn.forEach((p, i) => {
      if (p) names.push(BTN_LABEL[i] || String(i));
      if (p && !prev.btn[i] && BTN[i]) handleBtn(BTN[i]);
    });
    ['up', 'down', 'left', 'right'].forEach(d => {
      const k = gp.index + d;
      if (dir[d]) {
        if (!prev.dir[d]) { handleBtn(d); repeatAt[k] = now + 320; }
        else if (now >= (repeatAt[k] || 0)) { handleBtn(d); repeatAt[k] = now + 140; }
      }
    });
    prevPad[gp.index] = { btn, dir };
  }
  const txt = names.length ? names.join(' + ') : 'Keine Eingabe';
  if (txt !== lastPad) { lastPad = txt; const ps = $('#padState'); if (ps) ps.textContent = txt; }
}
window.addEventListener('gamepadconnected', e => { sfx('ok'); toast('Controller verbunden: ' + (e.gamepad.id || '').slice(0, 28)); updateHints(); });
window.addEventListener('gamepaddisconnected', () => { toast('Controller getrennt'); updateHints(); });

/* ============ input: pointer ============ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-f],[data-action]');
  if (!el || el.tagName === 'INPUT') return;
  const root = scopeRoot();
  if (!root.contains(el)) return;
  if (el.hasAttribute('data-f')) setFocus(el);
  if (el.dataset.action) activate(el);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.tagName === 'INPUT' && el.type === 'range') {
    if (el.dataset.action && ACT[el.dataset.action]) ACT[el.dataset.action](el);
    el.style.setProperty('--p', (el.value / (el.max || 100) * 100) + '%');
  }
});

/* ============ central button handler ============ */
function handleBtn(b) {
  if (curView === 'boot') { skipBoot(); return; }
  if (b === 'b') {
    if (dialogOpen()) return closeDialog(-1);
    if (qmOpen()) return closeQuick();
    if (friendsOpen()) return closeFriends();
    if (curView === 'setup') return ACT['setup-back']();
    if (curView !== 'home') return goBack();
    return;
  }
  if (b === 'start' || b === 'y') {
    if (dialogOpen()) return;
    if (qmOpen()) return closeQuick();
    openQuick();
    return;
  }
  if (b === 'lb' || b === 'rb') {
    if (curView === 'home' && !dialogOpen() && !qmOpen() && !friendsOpen()) { S.tab = S.tab === 'games' ? 'media' : 'games'; save(); rerender(renderHome); }
    return;
  }
  if (b === 'x') {
    if (curView === 'home' && !dialogOpen() && !qmOpen() && !friendsOpen()) ACT['open-search']();
    return;
  }
  if (b === 'a') { if (focusEl) activate(focusEl); return; }
  if (b === 'up' || b === 'down' || b === 'left' || b === 'right') {
    if (focusEl && focusEl.type === 'range' && (b === 'left' || b === 'right')) { rangeAdjust(focusEl, b === 'right' ? 1 : -1); return; }
    if (focusEl && focusEl.dataset.slider === 'vol' && (b === 'left' || b === 'right')) { volStep(b === 'right' ? 1 : -1); return; }
    move(b);
  }
}

/* ============ init ============ */
function init() {
  applyUI(); applyFrame(); applyLang();
  applyAccent(activeProfile().accent);
  resizeBG();
  window.addEventListener('resize', resizeBG);
  tickClock(); setInterval(tickClock, 1000);
  if (navigator.getBattery) {
    navigator.getBattery().then(b => {
      const up = () => { $('#batPct').textContent = Math.round(b.level * 100) + '%'; };
      up(); b.addEventListener('levelchange', up);
    }).catch(() => {});
  }
  const loop = now => { drawBG(now); pollPads(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  startBoot();
}
init();
})();
</script>
</body>
