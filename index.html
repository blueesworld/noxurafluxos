<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050811">
<title>NoxuraFluxOS 9.0</title>
<style>
:root{
  --accent:#2f8cff;--accent-2:#5ad8ff;--accent-soft:#8fc4ff;
  --danger:#ff4d42;--ok:#46e39b;
  --text:#eef3ff;--muted:#93a6c8;
  --line:rgba(160,195,255,.10);
  --panel:rgba(16,24,44,.72);
  --card:rgba(20,28,48,.85);
  --ui:1;--frame:0px;--hints-h:2.6rem;
  --shadow:0 10px 40px rgba(0,0,0,.55);
  --shadow-sm:0 4px 16px rgba(0,0,0,.35);
}
html.hc{--muted:#c9d6ee;--line:rgba(200,225,255,.42)}
html{font-size:calc(clamp(10px,1.1vh + .36vw,18px) * var(--ui));height:100%;background:#050811}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI","SF Pro Text",system-ui,-apple-system,Helvetica,Arial,sans-serif;color:var(--text);user-select:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
svg{display:block}
#app{position:fixed;inset:var(--frame);overflow:hidden;background:#050811}
#bg{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:.4}
#shade{position:absolute;inset:0;pointer-events:none;z-index:1;background:linear-gradient(180deg,rgba(5,8,17,.5),rgba(5,8,17,.97))}

.view{position:absolute;left:0;right:0;top:0;bottom:var(--hints-h);display:none;flex-direction:column;min-width:0;z-index:5;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.view.active{display:flex;animation:viewIn .25s cubic-bezier(.22,.7,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(.3rem)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes tileIn{from{opacity:0;transform:translateY(.5rem)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes markIn{from{opacity:0;letter-spacing:.7em}to{opacity:1;letter-spacing:.42em}}
@keyframes shine{0%{left:-60%}60%,100%{left:120%}}

[data-f]{position:relative;outline:none;border-radius:.5rem}
[data-f].is-focus{box-shadow:0 0 0 2px #fff,0 8px 28px rgba(47,140,255,.45);z-index:3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.62rem 1.35rem;border-radius:.5rem;font-size:.84rem;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);transition:transform .15s,background .15s,box-shadow .15s}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.danger{background:rgba(255,77,66,.14);border-color:rgba(255,77,66,.4);color:#ffb2ac}
.btn.ghost{background:transparent}
.btn.is-focus{background:#fff;color:#0a1220;transform:scale(1.03)}
.btn.primary.is-focus{background:#fff;color:#0a1220}
.chips{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.chip{padding:.32rem .85rem;border-radius:99rem;font-size:.7rem;font-weight:600;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
.chip.on{background:rgba(255,255,255,.14);color:#fff}
.chip.is-focus{background:#fff;color:#0a1220;transform:scale(1.04)}
.iconbtn{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;color:#d8e4fa;background:rgba(20,28,48,.55);border:1px solid rgba(255,255,255,.08);transition:transform .15s,background .15s;position:relative}
.iconbtn svg{width:1.05rem;height:1.05rem}
.iconbtn.is-focus{background:#fff;color:#0a1220;transform:scale(1.08)}
.badge{position:absolute;top:-.15rem;right:-.15rem;min-width:1rem;height:1rem;padding:0 .25rem;border-radius:99rem;background:var(--ok);color:#03241a;font-size:.58rem;font-weight:800;display:grid;place-items:center}
.avatar{border-radius:50%;overflow:hidden;background:#0c1428;display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.avatar svg{width:100%;height:100%}
.empty{padding:2rem;color:var(--muted);font-size:.8rem;text-align:center}
.sec-title{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:1.3rem 0 .6rem}
.kv{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.6rem 0;border-bottom:1px solid var(--line);font-size:.8rem}
.kv b{color:var(--muted);font-weight:500}
.kv span{font-weight:600;text-align:right}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;padding:.22rem .6rem;border-radius:99rem;font-size:.66rem;font-weight:700;background:rgba(70,227,155,.12);color:#9df5c9}
.pill.off{background:rgba(255,255,255,.06);color:var(--muted)}
.sbar{height:.4rem;border-radius:99rem;background:rgba(255,255,255,.08);overflow:hidden;margin-top:.8rem}
.sbar i{display:block;height:100%;background:var(--accent)}
.slegend{display:flex;justify-content:space-between;font-size:.66rem;color:var(--muted);margin-top:.35rem}
.bar{height:.3rem;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden;margin-top:.35rem}
.bar i{display:block;height:100%;background:var(--accent)}
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.1) 37%,rgba(255,255,255,.04) 63%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:.6rem}
.loading{display:flex;align-items:center;gap:.9rem;color:var(--muted);font-size:.8rem;padding:1rem 0}
.spin{width:1.4rem;height:1.4rem;border-radius:50%;border:.18rem solid rgba(255,255,255,.14);border-top-color:var(--accent);animation:spin .8s linear infinite}

/* ===== PS4 TOP BAR ===== */
.topbar{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.1rem 2.4rem .6rem}
.top-left{display:flex;align-items:center;gap:1.8rem;min-width:0}
.top-right{display:flex;align-items:center;gap:.5rem}
.profile-chip{display:flex;align-items:center;gap:.7rem;padding:.25rem .9rem .25rem .3rem;border-radius:99rem;transition:background .18s}
.profile-chip .avatar{width:2.2rem;height:2.2rem}
.profile-chip.is-focus{background:rgba(255,255,255,.12)}
.pname{font-size:.85rem;font-weight:600;max-width:10rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plvl{font-size:.66rem;color:var(--muted)}
.tabs{display:flex;gap:0;align-items:center;background:rgba(20,28,48,.55);border:1px solid rgba(255,255,255,.08);border-radius:99rem;padding:.25rem .3rem;position:relative}
.tabs::before,.tabs::after{content:'';position:absolute;top:50%;width:1.7rem;height:1.7rem;border-radius:50%;border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;transform:translateY(-50%);font-size:.58rem;font-weight:800;color:var(--muted);background:rgba(255,255,255,.03)}
.tabs::before{content:'L1';left:-2.5rem}
.tabs::after{content:'R1';right:-2.5rem}
.tab{padding:.45rem 1.15rem;border-radius:99rem;font-size:.8rem;font-weight:600;color:var(--muted);transition:background .2s,color .2s;position:relative}
.tab.on{color:#fff;background:rgba(255,255,255,.14)}
.tab.is-focus{background:#fff;color:#0a1220}
.status{display:flex;align-items:center;gap:.7rem;margin-left:.4rem;color:#d8e4fa;font-size:.74rem;padding:.35rem .8rem;border-radius:99rem;background:rgba(20,28,48,.55);border:1px solid rgba(255,255,255,.08)}
.status svg{width:.95rem;height:.95rem}
#clock{font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.02em}

#hints{position:absolute;left:0;right:0;bottom:0;height:var(--hints-h);display:flex;align-items:center;justify-content:space-between;padding:0 1.6rem;font-size:.7rem;color:var(--muted);pointer-events:none;z-index:60;background:linear-gradient(0deg,rgba(3,5,12,.92),rgba(3,5,12,0))}
#hints .hgroup{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.hitem{display:inline-flex;align-items:center;white-space:nowrap}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:1.4rem;height:1.4rem;padding:0 .3rem;margin-right:.4rem;border-radius:.35rem;background:rgba(255,255,255,.1);font-size:.66rem;font-weight:800;color:#fff}
.key.on{background:var(--ok);color:#03241a}

#view-boot{align-items:center;justify-content:center}
.boot-logo{display:flex;flex-direction:column;align-items:center;gap:1rem}
.boot-mark{position:relative;font-size:clamp(2.4rem,6.5vw,5rem);font-weight:700;letter-spacing:.42em;padding-left:.42em;overflow:hidden;color:#f2f7ff;animation:markIn 1.3s cubic-bezier(.16,1,.3,1) both}
.boot-mark .shine{position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 2.6s 1s ease-in-out infinite}
.boot-os{font-size:.8rem;letter-spacing:.42em;color:var(--accent-soft);opacity:0;animation:fadeIn .8s .8s both;padding-left:.42em}
.boot-os b{color:#fff;font-weight:700}
.boot-bar{width:min(18rem,46vw);height:.16rem;border-radius:99rem;overflow:hidden;background:rgba(255,255,255,.1);margin-top:.8rem;opacity:0;animation:fadeIn .5s 1s both}
.boot-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width 2.6s cubic-bezier(.4,0,.2,1)}
.boot-hint{margin-top:1.4rem;font-size:.72rem;color:var(--muted);opacity:0;animation:fadeIn .6s 1.6s both;padding:.3rem .6rem;border-radius:.4rem}
.boot-hint.is-focus{color:#fff}

#view-setup{padding:2rem 3.2rem}
.setup-shell{display:flex;flex-direction:column;height:100%;gap:1rem}
.setup-step{font-size:.68rem;letter-spacing:.2em;color:var(--accent-soft);font-weight:700}
.setup-title{font-size:1.8rem;font-weight:600;margin:.4rem 0 0;letter-spacing:-.01em}
.setup-sub{margin:.4rem 0 0;color:var(--muted);font-size:.84rem;max-width:60ch;line-height:1.5}
.setup-body{flex:1;min-height:0;overflow-y:auto;padding:.6rem .2rem;display:flex;flex-direction:column;gap:.6rem;align-items:flex-start;scrollbar-width:none;max-width:44rem}
.setup-foot{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.opt{display:flex;flex-direction:column;gap:.25rem;padding:.9rem 1.2rem;border-radius:.6rem;min-width:16rem;background:var(--panel);border:1px solid var(--line);transition:transform .14s,background .15s;text-align:left}
.opt b{font-size:.92rem;font-weight:600}
.opt span{font-size:.7rem;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:rgba(47,140,255,.14)}
.opt.is-focus{transform:translateX(.3rem);background:rgba(255,255,255,.1)}
.calib{width:100%;height:8rem;border-radius:.6rem;position:relative;border:1px dashed rgba(170,200,255,.35);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.74rem;margin-bottom:.4rem}

#view-profiles{align-items:center;justify-content:center;gap:2rem}
.profiles-title{font-size:1.5rem;font-weight:300;letter-spacing:.1em;color:#e6eefc}
.profiles-row{display:flex;gap:2rem;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.profile-card{display:flex;flex-direction:column;align-items:center;gap:.6rem;padding:.8rem;border-radius:.8rem;width:9rem;transition:transform .16s,background .16s}
.profile-card .big{width:5.4rem;height:5.4rem;border-radius:50%;overflow:hidden;border:2px solid transparent;transition:border-color .2s}
.profile-card .big svg{width:100%;height:100%}
.profile-card .nm{font-size:.88rem;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-card .lv{font-size:.66rem;color:var(--muted)}
.profile-card.add .big{display:grid;place-items:center;border:1px dashed rgba(170,200,255,.4);font-size:1.6rem;color:var(--muted)}
.profile-card.is-focus{transform:translateY(-.3rem);background:rgba(255,255,255,.05)}
.profile-card.is-focus .big{border-color:#fff}

#view-home{overflow:hidden}
#heroArt{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center 30%;animation:fadeIn .5s both}
#heroArt::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#050811 0%,rgba(5,8,17,.7) 40%,rgba(5,8,17,.4) 100%),linear-gradient(90deg,rgba(5,8,17,.6),transparent 65%)}
.hero{position:relative;z-index:5;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 2.4rem .4rem;pointer-events:none}
.hero-text.swap{animation:fadeIn .35s both}
.hero-kicker{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-soft);font-weight:700}
.hero-title{font-size:clamp(1.5rem,3.2vw,2.6rem);font-weight:600;margin:.3rem 0 .2rem;line-height:1.1;letter-spacing:-.01em}
.hero-sub{font-size:.8rem;color:#c5d4ee;margin:0;max-width:56ch;line-height:1.45}
.rail-label{position:relative;z-index:5;padding:0 2.4rem;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rail{position:relative;z-index:5;display:flex;align-items:center;gap:1.1rem;padding:1.4rem 2.4rem 1.6rem;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tile{position:relative;flex:none;border-radius:.5rem;height:clamp(8.5rem,40vh,19rem);aspect-ratio:3/4;background:#0c1428;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .2s cubic-bezier(.22,.7,.2,1);animation:tileIn .4s cubic-bezier(.22,.7,.2,1) both;animation-delay:calc(var(--i,0) * 40ms);box-shadow:0 8px 24px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05)}
.tile .art{position:absolute;inset:0;background-size:cover;background-position:center}
.tile .art::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,8,17,.92) 2%,rgba(5,8,17,0) 60%)}
.tile .tmeta{position:relative;z-index:2;padding:.85rem .9rem;display:flex;flex-direction:column;gap:.1rem}
.tile .tname{font-size:.85rem;font-weight:600;line-height:1.2;letter-spacing:.01em}
.tile .tsub{font-size:.62rem;color:#b9c9e6;letter-spacing:.05em;text-transform:uppercase;opacity:.85}
.tile.is-focus{transform:translateY(-.4rem) scale(1.03)}
.tile.add{display:grid;place-items:center;background:rgba(255,255,255,.03);border:1px dashed rgba(170,200,255,.3)}
.tile.add .plus{font-size:2.4rem;font-weight:200;color:var(--accent-soft);line-height:1}
.tile.add .label{margin-top:.6rem;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;padding:0 1rem;line-height:1.5}

/* ===== SEARCH ===== */
#searchOverlay{position:absolute;inset:0;z-index:85;display:none;flex-direction:column;background:rgba(5,8,17,.97);backdrop-filter:blur(12px);padding:1.6rem 2.4rem}
#searchOverlay.open{display:flex;animation:fadeIn .2s both}
.search-bar{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.2rem;border-radius:.6rem;background:rgba(20,28,48,.85);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.search-bar svg{width:1.2rem;height:1.2rem;color:var(--muted);flex:none}
.search-bar input{flex:1;background:none;border:0;outline:none;color:var(--text);font-size:1rem;font-weight:500}
.search-bar input::placeholder{color:var(--muted)}
.search-hint{font-size:.66rem;color:var(--muted);margin-top:.6rem;padding-left:.2rem}
.search-results{flex:1;min-height:0;overflow-y:auto;margin-top:1.4rem;scrollbar-width:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(9rem,16vw,13rem),1fr));gap:1rem;align-content:start}
.search-results::-webkit-scrollbar{display:none}
.search-group{grid-column:1/-1;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:.6rem 0 .2rem}
.search-empty{grid-column:1/-1;padding:3rem 2rem;text-align:center;color:var(--muted);font-size:.86rem}

/* ===== STORE ===== */
.store-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 2.4rem .3rem;flex-wrap:wrap}
.store-title{font-size:1.4rem;font-weight:600;margin:0;letter-spacing:-.01em}
.store-title span{color:var(--accent-soft);font-weight:400}
.store-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 2.4rem 1.4rem;scrollbar-width:none;animation:fadeIn .4s both}
.store-body::-webkit-scrollbar{display:none}
.hero-banner{position:relative;border-radius:.8rem;overflow:hidden;height:clamp(9rem,32vh,17rem);display:flex;align-items:flex-end;padding:1.2rem 1.4rem;margin:.6rem 0 .8rem;border:1px solid var(--line);box-shadow:var(--shadow)}
.hb-art{position:absolute;inset:0;background-size:cover;background-position:center}
.hb-art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,8,17,.92) 10%,rgba(5,8,17,.2) 70%)}
.hb-info{position:relative;z-index:2;display:flex;flex-direction:column;gap:.3rem;max-width:60%}
.hb-kicker{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-soft);font-weight:700}
.hb-title{font-size:1.4rem;font-weight:600;margin:0}
.hb-sub{font-size:.76rem;color:#c5d4ee;margin:0 0 .4rem}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(9rem,16vw,13rem),1fr));gap:1rem}
.sk{aspect-ratio:3/4}
.card{border-radius:.5rem;overflow:hidden;background:var(--card);border:1px solid var(--line);transition:transform .16s;box-shadow:var(--shadow-sm)}
.c-art{position:relative;aspect-ratio:3/4;background-size:cover;background-position:center}
.lock{position:absolute;top:.4rem;right:.4rem;font-size:.5rem;letter-spacing:.08em;font-weight:700;padding:.15rem .35rem;border-radius:.25rem;background:rgba(255,77,66,.9);color:#fff}
.badge-dl{position:absolute;top:.4rem;left:.4rem;font-size:.5rem;letter-spacing:.08em;font-weight:700;padding:.15rem .35rem;border-radius:.25rem;background:rgba(70,227,155,.92);color:#03241a}
.badge-own{position:absolute;top:.4rem;left:.4rem;font-size:.5rem;letter-spacing:.08em;font-weight:700;padding:.15rem .35rem;border-radius:.25rem;background:rgba(47,140,255,.92);color:#fff}
.c-meta{padding:.55rem .6rem .65rem;display:flex;flex-direction:column;gap:.15rem}
.c-name{font-size:.76rem;font-weight:600;line-height:1.2}
.c-tag{font-size:.6rem;color:var(--muted)}
.card.is-focus{transform:translateY(-.25rem)}

#view-detail{padding:0}
.detail-wrap{display:flex;flex-direction:column;height:100%;min-height:0}
.detail-hero{position:relative;height:clamp(8rem,30vh,16rem);flex:none;overflow:hidden}
.d-art{position:absolute;inset:0;background-size:cover;background-position:center 30%}
.d-art::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#050811 2%,rgba(5,8,17,.4) 60%,rgba(5,8,17,.7) 100%)}
.detail-head{position:absolute;left:2.4rem;right:2.4rem;bottom:.9rem;z-index:2}
.detail-title{font-size:clamp(1.3rem,2.6vw,2.1rem);font-weight:600;margin:0}
.detail-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
.detail-body{flex:1;min-height:0;overflow-y:auto;padding:1rem 2.4rem 1.4rem;display:grid;grid-template-columns:1.4fr 1fr;gap:1.8rem;scrollbar-width:none;align-content:start}
.detail-body::-webkit-scrollbar{display:none}
.detail-desc{font-size:.82rem;line-height:1.6;color:#c5d4ee;margin:0 0 .8rem}
.trailer{position:relative;border-radius:.5rem;overflow:hidden;aspect-ratio:16/9;border:1px solid var(--line);background-size:cover;background-position:center;margin-bottom:.4rem}
.trailer .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,8,17,.3)}
.trailer .play i{width:2.4rem;height:2.4rem;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-style:normal;color:#fff;font-size:.7rem}
.trailer .lbl{position:absolute;left:.6rem;bottom:.5rem;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:#e6eefc}
.drow{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.78rem}
.drow b{color:var(--muted);font-weight:500}
.buybox{display:flex;flex-direction:column;gap:.6rem;align-content:start}
.buybox .btn{width:100%}
.buybtn-off{width:100%;padding:.8rem 1.2rem;border-radius:.5rem;font-weight:700;font-size:.86rem;background:rgba(255,255,255,.05);color:#6f7f99;border:1px solid var(--line);cursor:not-allowed}
.buybtn-off.is-focus{background:rgba(255,77,66,.1);color:#ffb2ac;border-color:rgba(255,77,66,.5)}
.warn{font-size:.74rem;font-weight:600;line-height:1.5;color:var(--danger);padding:.6rem .75rem;border-radius:.5rem;background:rgba(255,77,66,.08);border:1px solid rgba(255,77,66,.3)}
.okmsg{font-size:.74rem;font-weight:600;line-height:1.5;color:var(--ok);padding:.6rem .75rem;border-radius:.5rem;background:rgba(70,227,155,.08);border:1px solid rgba(70,227,155,.3)}
.dlbar{height:.5rem;border-radius:99rem;background:rgba(255,255,255,.1);overflow:hidden;margin:.4rem 0}
.dlbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s}

#view-game{padding:0}
.g-art{position:absolute;inset:0;background-size:cover;background-position:center 25%;animation:fadeIn .5s both}
.g-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,8,17,.96) 8%,rgba(5,8,17,.45) 65%),linear-gradient(0deg,#050811 0%,rgba(5,8,17,0) 55%)}
.g-wrap{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;padding:.9rem 2.4rem 1rem;min-height:0}
.g-tabs{display:flex;gap:.2rem;justify-content:center;flex:none}
.g-head{margin-top:auto;flex:none}
.g-title{font-size:clamp(1.6rem,3.6vw,3rem);font-weight:600;margin:0;line-height:1.05;letter-spacing:-.01em}
.g-meta{color:var(--muted);font-size:.82rem;margin:.35rem 0 1rem}
.g-actions{display:flex;gap:.6rem;flex-wrap:wrap;flex:none}
.g-panel{margin-top:1.1rem;max-height:34vh;overflow-y:auto;scrollbar-width:none;padding-right:.4rem;flex:none}
.g-panel::-webkit-scrollbar{display:none}
.g-desc{font-size:.8rem;line-height:1.6;color:#c5d4ee;max-width:60ch;margin:0 0 1rem}
.g-stats{display:flex;gap:2.2rem;margin-bottom:.4rem}
.g-stats b{display:block;font-size:1.1rem;font-weight:600}
.g-stats span{font-size:.68rem;color:var(--muted)}
.props{display:grid;grid-template-columns:1fr 1fr;gap:0 2rem}
.trophy-row{display:flex;align-items:center;gap:.9rem;padding:.6rem 0;border-bottom:1px solid var(--line)}
.trophy-row .tic{width:2rem;height:2rem;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.66rem;font-weight:800;border:2px solid rgba(255,255,255,.2);color:var(--muted)}
.trophy-row .tic.on{border-color:#ffd479;color:#ffd479}
.trophy-row .tt{flex:1;min-width:0}
.trophy-row .tn{font-size:.8rem;font-weight:600}
.trophy-row .td{font-size:.66rem;color:var(--muted)}

.lib-head{padding:1rem 2.4rem .5rem;display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.lib-note{font-size:.7rem;color:var(--muted);max-width:60ch;line-height:1.5}
.lib-grid{flex:1;min-height:0;overflow-y:auto;padding:.4rem 2.4rem .8rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(11rem,20vw,16rem),1fr));gap:.6rem;align-content:start;scrollbar-width:none}
.lib-grid::-webkit-scrollbar{display:none}
.librow{display:flex;align-items:center;gap:.7rem;padding:.55rem .7rem;border-radius:.5rem;background:var(--card);border:1px solid var(--line);transition:transform .15s,background .15s}
.librow.is-focus{background:rgba(255,255,255,.1);transform:translateX(.2rem)}
.appic{width:2.2rem;height:2.2rem;border-radius:.4rem;flex:none;display:grid;place-items:center;font-size:.84rem;font-weight:700;color:#fff}
.lname{font-size:.78rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lpkg{font-size:.6rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltxt{min-width:0;flex:1}
.check{width:1.1rem;height:1.1rem;border-radius:.3rem;border:1px solid rgba(170,200,255,.45);display:grid;place-items:center;font-size:.66rem;color:#0a1220;flex:none}
.check.on{background:#fff;border-color:#fff}
.lib-foot{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 2.4rem 1rem;flex-wrap:wrap}
.gal-grid{flex:1;min-height:0;overflow-y:auto;padding:.4rem 2.4rem 1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(8rem,14vw,13rem),1fr));gap:.7rem;align-content:start;scrollbar-width:none}
.gal-grid::-webkit-scrollbar{display:none}
.shot{position:relative;border-radius:.5rem;overflow:hidden;aspect-ratio:16/9;border:1px solid var(--line);transition:transform .16s}
.s-art{position:absolute;inset:0;background-size:cover;background-position:center}
.s-cap{position:absolute;left:.45rem;bottom:.4rem;font-size:.6rem;color:#e6eefc;text-shadow:0 0 4px #000}
.shot.is-focus{transform:scale(1.03)}

#view-settings{padding:0}
.settings-shell{display:flex;gap:1.2rem;flex:1;min-height:0;padding:1rem 2.4rem}
.settings-list{width:min(16rem,28%);display:flex;flex-direction:column;gap:.2rem;overflow-y:auto;scrollbar-width:none}
.settings-list::-webkit-scrollbar{display:none}
.srow{display:flex;align-items:center;gap:.7rem;padding:.6rem .8rem;border-radius:.5rem;font-size:.82rem;font-weight:600;color:#cfdcf5;transition:background .15s}
.srow.on{background:rgba(255,255,255,.08);color:#fff}
.srow.is-focus{background:#fff;color:#0a1220}
.settings-pane{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:1rem 1.4rem;overflow-y:auto;scrollbar-width:none}
.settings-pane::-webkit-scrollbar{display:none}
.pane-title{font-size:1.1rem;font-weight:600;margin:0 0 .15rem}
.pane-sub{font-size:.72rem;color:var(--muted);margin:0 0 .8rem;line-height:1.5}

#friendsPanel{position:absolute;top:0;right:0;bottom:0;width:min(24rem,44vw);z-index:70;background:rgba(9,15,30,.97);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .3s cubic-bezier(.22,.7,.2,1);display:flex;flex-direction:column}
#friendsPanel.open{transform:none}
.panel-head{padding:1.1rem 1.2rem .8rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.panel-title{font-size:1.1rem;font-weight:600}
.panel-sub{font-size:.66rem;color:var(--muted);margin-top:.15rem}
.party{margin:.2rem .8rem .6rem;padding:.7rem .8rem;border-radius:.6rem;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.plabel{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-soft);font-weight:700}
.pname2{font-size:.76rem;font-weight:600;margin-top:.2rem}
.friends-list{flex:1;min-height:0;overflow-y:auto;padding:0 .8rem;scrollbar-width:none}
.friends-list::-webkit-scrollbar{display:none}
.frow{display:flex;align-items:center;gap:.7rem;padding:.6rem .5rem;border-radius:.5rem;transition:background .15s}
.frow.is-focus{background:rgba(255,255,255,.1)}
.fmeta{min-width:0;flex:1}
.fname{font-size:.78rem;font-weight:600;display:flex;align-items:center;gap:.4rem}
.dot{width:.4rem;height:.4rem;border-radius:50%;background:var(--ok)}
.dot.off{background:#5d6b84}
.fact{font-size:.64rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-foot{padding:.7rem 1rem 1rem}
.panel-foot .btn{width:100%}

#quickMenu{position:absolute;left:0;right:0;bottom:0;z-index:80;padding:0 1.2rem calc(var(--hints-h) + .3rem);transform:translateY(110%);opacity:0;transition:transform .3s cubic-bezier(.22,.7,.2,1),opacity .25s;pointer-events:none}
#quickMenu.open{transform:none;opacity:1;pointer-events:auto}
.qm-inner{border-radius:.7rem;padding:.8rem .9rem;background:rgba(12,19,36,.97);border:1px solid var(--line);display:flex;flex-direction:column;gap:.7rem;box-shadow:var(--shadow)}
.qm-top{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.qm-user{display:flex;align-items:center;gap:.6rem}
.qm-user .avatar{width:1.8rem;height:1.8rem}
.qm-name{font-size:.8rem;font-weight:600}
.qm-sub{font-size:.62rem;color:var(--muted)}
.qm-row{display:flex;align-items:center;gap:.5rem;overflow-x:auto;scrollbar-width:none;padding:.1rem}
.qm-row::-webkit-scrollbar{display:none}
.qbtn{flex:none;min-width:5.6rem;height:3.2rem;padding:0 .9rem;border-radius:.5rem;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:.72rem;font-weight:600;color:#d8e4fa;transition:transform .15s,background .15s}
.qbtn.is-focus{background:#fff;color:#0a1220;transform:translateY(-.15rem)}
.qbtn.danger2.is-focus{background:var(--danger);color:#fff}
.qm-vol{flex:none;display:flex;align-items:center;gap:.6rem;padding:.5rem .8rem;min-width:13rem;border-radius:.5rem;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.qm-vol.is-focus{background:#fff;color:#0a1220}
.qm-vol .lab{font-size:.66rem;white-space:nowrap}
.volbar{flex:1;height:.3rem;border-radius:99rem;background:rgba(255,255,255,.14);position:relative}
.volbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99rem;background:var(--accent)}
.vlabel{font-size:.62rem;min-width:2.2rem;text-align:right;font-variant-numeric:tabular-nums}

#dialogLayer{position:absolute;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(3,5,12,.7);padding:2rem}
#dialogLayer.open{display:flex;animation:fadeIn .2s both}
.dialog-card{width:min(32rem,86vw);max-height:80vh;overflow-y:auto;border-radius:.7rem;padding:1.3rem 1.4rem;background:#0d1628;border:1px solid var(--line);box-shadow:var(--shadow)}
.dlg-kicker{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-soft);font-weight:700;margin-bottom:.4rem}
.dlg-title{font-size:1.1rem;font-weight:600;margin:0 0 .5rem}
.dlg-body{font-size:.8rem;line-height:1.6;color:#c5d4ee}
.dlg-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.1rem;flex-wrap:wrap}
#toast{position:absolute;left:50%;bottom:calc(var(--hints-h) + 1rem);transform:translate(-50%,.8rem);z-index:95;padding:.55rem 1rem;border-radius:.4rem;font-size:.74rem;font-weight:600;background:#101b33;border:1px solid var(--line);opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;max-width:80vw;text-align:center;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0)}

#rotate{position:absolute;inset:0;z-index:120;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;background:#050811;text-align:center;padding:2rem}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
#rotate p{font-size:.8rem;color:var(--muted);max-width:28ch;line-height:1.6;margin:0}

#gameHost{position:absolute;inset:0;z-index:100;display:none;background:#000;flex-direction:column}
#gameHost.open{display:flex}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000;touch-action:none}
#gameTopBar{position:absolute;top:0;left:0;right:0;padding:.8rem 1.2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;z-index:5;background:linear-gradient(0deg,transparent,rgba(0,0,0,.7));pointer-events:none}
#gameTopBar .gt-name{font-size:.9rem;font-weight:600;color:#fff;text-shadow:0 2px 8px #000}
#gameTopBar .gt-help{font-size:.7rem;color:#b9c9e6;text-shadow:0 2px 8px #000;display:flex;align-items:center;gap:.6rem}
#gameTopBar .gt-help .key{background:rgba(255,255,255,.18)}
#gameOverlay{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;flex-direction:column;gap:1rem;background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
#gameOverlay.open{display:flex}
#gameOverlay .go-title{font-size:1.6rem;font-weight:700;color:#fff}
#gameOverlay .go-sub{font-size:.84rem;color:#c5d4ee;max-width:40ch;text-align:center;line-height:1.5}
#gameOverlay .go-row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
#gameOverlay .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
#gameOverlay .btn.primary{background:var(--accent);border-color:transparent;color:#fff}
#exitHold{position:absolute;left:50%;bottom:2rem;transform:translateX(-50%);z-index:7;display:none;flex-direction:column;align-items:center;gap:.5rem;pointer-events:none}
#exitHold.show{display:flex}
#exitHold .eh-ring{width:4rem;height:4rem;border-radius:50%;background:conic-gradient(var(--danger) calc(var(--p,0) * 1%),rgba(255,255,255,.15) 0);display:grid;place-items:center;transition:background .05s linear}
#exitHold .eh-ring i{width:3.2rem;height:3.2rem;border-radius:50%;background:#050811;display:grid;place-items:center;font-style:normal;font-size:.7rem;font-weight:800;color:#fff;letter-spacing:.05em}
#exitHold .eh-lbl{font-size:.7rem;color:#fff;text-shadow:0 2px 6px #000;letter-spacing:.05em;text-transform:uppercase;font-weight:700}

@media (max-height:26rem){
  :root{--hints-h:2.1rem}
  .hero-sub{display:none}
  .rail-label{display:none}
  .tile{height:clamp(7rem,44vh,14rem)}
}
html.noanim *,html.noanim *::before,html.noanim *::after{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div id="app">
  <canvas id="bg"></canvas>
  <div id="shade"></div>

  <section id="view-boot" class="view">
    <div class="boot-logo">
      <div class="boot-mark"><span>NOXURA</span><div class="shine"></div></div>
      <div class="boot-os">NOXURAFLUXOS <b>9.0</b></div>
      <div class="boot-bar"><i id="bootBar"></i></div>
      <div class="boot-hint" id="bootHint" data-f data-action="boot-skip"></div>
    </div>
  </section>

  <section id="view-setup" class="view">
    <div class="setup-shell">
      <div>
        <div class="setup-step" id="setupStep"></div>
        <h1 class="setup-title" id="setupTitle"></h1>
        <p class="setup-sub" id="setupSub"></p>
      </div>
      <div class="setup-body" id="setupBody"></div>
      <div class="setup-foot">
        <button class="btn ghost" data-f data-action="setup-back" id="setupBack"></button>
        <button class="btn primary" data-f data-action="setup-next" id="setupNext"></button>
      </div>
    </div>
  </section>

  <section id="view-profiles" class="view">
    <div class="profiles-title" id="profilesTitle"></div>
    <div class="profiles-row" id="profilesRow"></div>
  </section>

  <section id="view-home" class="view">
    <div id="heroArt"></div>
    <header class="topbar">
      <div class="top-left">
        <div class="profile-chip" data-f data-action="open-profiles">
          <div class="avatar" id="topAvatar"></div>
          <div>
            <div class="pname" id="topName"></div>
            <div class="plvl" id="topLevel"></div>
          </div>
        </div>
        <nav class="tabs" id="navTabs"></nav>
      </div>
      <div class="top-right">
        <button class="iconbtn" data-f data-action="open-search" aria-label="Suche">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button class="iconbtn" data-f data-action="open-friends" aria-label="Freunde">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16.5 5.5a3 3 0 0 1 0 5.6"/><path d="M17 14.5a5 5 0 0 1 4 5"/></svg>
          <span class="badge" id="friendBadge">0</span>
        </button>
        <button class="iconbtn" data-f data-action="open-settings" aria-label="Einstellungen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>
        </button>
        <div class="status">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 8.5a15 15 0 0 1 19 0"/><path d="M5.8 12.2a10 10 0 0 1 12.4 0"/><path d="M9.2 15.8a5 5 0 0 1 5.6 0"/><circle cx="12" cy="19.2" r="1.2" fill="currentColor"/></svg>
          <span id="batPct"></span>
          <span id="clock">00:00</span>
        </div>
      </div>
    </header>
    <div class="hero">
      <div class="hero-text" id="heroText">
        <div class="hero-kicker" id="heroKicker"></div>
        <h1 class="hero-title" id="heroTitle"></h1>
        <p class="hero-sub" id="heroSub"></p>
      </div>
    </div>
    <div class="rail-label" id="railLabel"></div>
    <div class="rail" id="rail"></div>
  </section>

  <section id="view-store" class="view">
    <div class="store-head">
      <div style="display:flex;align-items:center;gap:1rem">
        <button class="btn ghost" data-f data-action="back" id="storeBack"></button>
        <h1 class="store-title" id="storeTitle"></h1>
      </div>
      <div class="chips" id="storeCats"></div>
    </div>
    <div class="store-body" id="storeBody"></div>
  </section>

  <section id="view-detail" class="view">
    <div class="detail-wrap" id="detailWrap"></div>
  </section>

  <section id="view-game" class="view">
    <div class="g-art" id="gArt"></div>
    <div class="g-shade"></div>
    <div class="g-wrap">
      <div class="g-tabs" id="gTabs"></div>
      <div class="g-head">
        <h1 class="g-title" id="gTitle"></h1>
        <div class="g-meta" id="gMeta"></div>
        <div class="g-actions" id="gActions"></div>
      </div>
      <div class="g-panel" id="gPanel"></div>
    </div>
  </section>

  <section id="view-library" class="view">
    <div class="lib-head">
      <div>
        <h1 class="store-title" id="libTitle" style="margin-bottom:.3rem"></h1>
        <div class="lib-note" id="libNote"></div>
      </div>
      <div class="chips"><button class="chip" data-f data-action="lib-custom" id="libCustom"></button></div>
    </div>
    <div class="lib-grid" id="libGrid"></div>
    <div class="lib-foot">
      <div class="lib-note" id="libCount"></div>
      <div class="actions">
        <button class="btn ghost" data-f data-action="lib-test" id="libTest"></button>
        <button class="btn ghost" data-f data-action="lib-cancel" id="libCancel"></button>
        <button class="btn primary" data-f data-action="lib-apply" id="libApply"></button>
      </div>
    </div>
  </section>

  <section id="view-gallery" class="view">
    <div class="lib-head">
      <div>
        <h1 class="store-title" id="galTitle" style="margin-bottom:.3rem"></h1>
        <div class="lib-note" id="galNote"></div>
      </div>
      <div class="chips"><button class="chip" data-f data-action="shot-take" id="galTake"></button></div>
    </div>
    <div class="gal-grid" id="galGrid"></div>
  </section>

  <section id="view-settings" class="view">
    <div class="settings-shell">
      <div class="settings-list" id="settingsList"></div>
      <div class="settings-pane" id="settingsPane"></div>
    </div>
  </section>

  <aside id="friendsPanel">
    <div class="panel-head">
      <div>
        <div class="panel-title" id="friendsTitle"></div>
        <div class="panel-sub" id="friendsSub"></div>
      </div>
      <button class="iconbtn" data-f data-action="close-friends" aria-label="Schließen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="party" id="partyBox"></div>
    <div class="friends-list" id="friendsList"></div>
    <div class="panel-foot"><button class="btn ghost" data-f data-action="friend-add" id="friendAdd"></button></div>
  </aside>

  <!-- SEARCH OVERLAY -->
  <div id="searchOverlay">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="text" id="searchInput" placeholder="Spiele, Apps und mehr suchen …" autocomplete="off">
      <button class="iconbtn" data-f data-action="close-search" aria-label="Schließen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="search-hint" id="searchHint">Tippe einen Namen ein. Ergebnisse erscheinen sofort.</div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <div id="quickMenu"><div class="qm-inner" id="quickInner"></div></div>

  <div id="dialogLayer">
    <div class="dialog-card">
      <div class="dlg-kicker" id="dlgKicker"></div>
      <h2 class="dlg-title" id="dlgTitle"></h2>
      <div class="dlg-body" id="dlgBody"></div>
      <div class="dlg-actions" id="dlgActions"></div>
    </div>
  </div>

  <div id="hints">
    <div class="hgroup" id="hintL"></div>
    <div class="hgroup" id="hintR"></div>
  </div>

  <div id="gameHost">

      bctx.fillStyle = `rgba(150,210,255,${.08 + p.s * .2})`;

}

/* ================= focus engine ================= */

}

}

}

    restoreSel = null;
  }

}
function rerender(fn) {

  const list = focusables();
  const el = (key && list.find(e => keyOf(e) === key)) || list.find(e => e.hasAttribute('data-default')) || list[0];

function move(dir) {
  const list = focusables();
  if (!list.length) return;
  if (!focusEl || !list.includes(focusEl)) return setFocus(list[0]);
  const r = focusEl.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bs = Infinity;
  for (const el of list) {
    if (el === focusEl) continue;
    const q = el.getBoundingClientRect();
    const dx = (q.left + q.width / 2) - cx, dy = (q.top + q.height / 2) - cy;

    else if (dir === 'left') { if (dx >= -4) continue; prim = -dx; sec = Math.abs(dy); }
    else if (dir === 'down') { if (dy <= 4) continue; prim = dy; sec = Math.abs(dx); }
    else { if (dy >= -4) continue; prim = -dy; sec = Math.abs(dx); }
    const s = prim + sec * 2.2;

function startDownload(id) {
  if (!CATALOG[id] || !CATALOG[id].downloadable) return;
  if (S.owned.includes(id)) return;
  if (S.downloads[id] !== undefined && S.downloads[id] < 100) return;
  S.downloads[id] = 0; save();
  toast(`${CATALOG[id].name} wird heruntergeladen …`);
  const iv = setInterval(() => {
    if (S.downloads[id] === undefined) { clearInterval(iv); return; }
    S.downloads[id] = Math.min(100, (S.downloads[id] || 0) + Math.random() * 14 + 6);
    save();
    if (curView === 'detail' && detailId === id) rerender(renderDetail);
    if (curView === 'store') rerender(renderStore);
    if (S.downloads[id] >= 100) {
      clearInterval(iv);
      S.owned.push(id);
      if (!S.library.includes(id)) S.library.push(id);
      save();
      sfx('ok');
      toast(`${CATALOG[id].name} installiert – bereit zum Spielen`);
      if (curView === 'detail' && detailId === id) rerender(renderDetail);
      if (curView === 'store') rerender(renderStore);
      if (curView === 'home') rerender(renderHome);
    }
  }, 500);
}

/* ================= GAMES ENGINE ================= */
const Game = {
  running: false, id: null, play: null, state: null, raf: null, last: 0, keys: {},
  canvas: null, ctx: null, W: 0, H: 0, dpr: 1,
  exitHoldStart: null, exitHoldActive: false,
  padIndex: null, startTime: 0,
  init() {
    this.canvas = $('#gameCanvas');
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('gamepadconnected', e => { this.padIndex = e.gamepad.index; });
    window.addEventListener('gamepaddisconnected', () => { this.padIndex = null; });
    window.addEventListener('keydown', e => {
      if (!this.running) return;
      this.keys[e.key.toLowerCase()] = true;
      if (e.key === 'Escape' || e.key === 'Backspace' || e.key.toLowerCase() === 'b') {
        e.preventDefault();
        this.startExitHold();
      }
    });
    window.addEventListener('keyup', e => {
      this.keys[e.key.toLowerCase()] = false;
      if (e.key === 'Escape' || e.key === 'Backspace' || e.key.toLowerCase() === 'b') {
        this.endExitHold();
      }
    });
    this.canvas.addEventListener('pointerdown', e => { if (this.play && this.play.onPointer) this.play.onPointer('down', e); });
    this.canvas.addEventListener('pointermove', e => { if (this.play && this.play.onPointer) this.play.onPointer('move', e); });
    this.canvas.addEventListener('pointerup', e => { if (this.play && this.play.onPointer) this.play.onPointer('up', e); });
  },
  resize() {
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.W = this.canvas.clientWidth;
    this.H = this.canvas.clientHeight;
    this.canvas.width = Math.round(this.W * this.dpr);
    this.canvas.height = Math.round(this.H * this.dpr);
    if (this.play && this.play.onResize) this.play.onResize(this.W, this.H);
  },
  start(id) {
    const g = CATALOG[id]; if (!g || !g.play) { toast('Dieses Spiel ist nicht spielbar'); return; }
    if (!g.demo && !S.owned.includes(id)) { toast('Spiel nicht installiert'); return; }
    if (!GAMES[g.play]) { toast('Spielmodul fehlt'); return; }
    this.id = id; this.play = GAMES[g.play]; this.state = null;
    this.running = true;
    $('#gameHost').classList.add('open');
    $('#gtName').textContent = g.name;
    $('#gameOverlay').classList.remove('open');
    $('#exitHold').classList.remove('show');
    this.resize();
    S.play[id] = (S.play[id] || 0) + 1;
    S.last[id] = Date.now();
    save();
    this.state = this.play.create(this.W, this.H);
    this.last = performance.now();
    this.startTime = performance.now();
    this.loop(performance.now());
    sfx('ok');
  },
  loop(now) {
    if (!this.running) return;
    const dt = Math.min(0.05, (now - this.last) / 1000);
    this.last = now;
    const pad = this.readPad();
    this.ctx.save();
    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    this.ctx.scale(this.dpr, this.dpr);
    this.play.update(this.state, dt, { keys: this.keys, pad, W: this.W, H: this.H });
    this.play.draw(this.ctx, this.state, this.W, this.H);
    this.ctx.restore();
    if (this.exitHoldStart !== null) {
      const held = (now - this.exitHoldStart) / 1000;
      const pct = clamp(held / 4 * 100, 0, 100);
      $('#exitHold').classList.add('show');
      $('#exitHold .eh-ring').style.setProperty('--p', pct);
      if (held >= 4) { this.stop(); return; }
    } else {
      $('#exitHold').classList.remove('show');
    }
    this.raf = requestAnimationFrame(t => this.loop(t));
  },
  readPad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    if (!pads) return null;
    let p = this.padIndex !== null ? pads[this.padIndex] : null;
    if (!p || !p.connected) for (const q of pads) if (q && q.connected) { p = q; this.padIndex = q.index; break; }
    if (!p) return null;
    const bBtn = p.buttons[1] || p.buttons[0];
    if (bBtn && bBtn.pressed) this.startExitHold();
    else this.endExitHold();
    const dz = 0.35;
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    return {
      lx: Math.abs(ax) > dz ? ax : 0, ly: Math.abs(ay) > dz ? ay : 0,
      a: !!(p.buttons[0] && p.buttons[0].pressed),
      b: !!(p.buttons[1] && p.buttons[1].pressed),
      up: !!(p.buttons[12] && p.buttons[12].pressed) || (ay < -dz),
      down: !!(p.buttons[13] && p.buttons[13].pressed) || (ay > dz),
      left: !!(p.buttons[14] && p.buttons[14].pressed) || (ax < -dz),
      right: !!(p.buttons[15] && p.buttons[15].pressed) || (ax > dz)
    };
  },
  startExitHold() {
    if (this.exitHoldStart === null) this.exitHoldStart = performance.now();
  },
  endExitHold() {
    this.exitHoldStart = null;
    $('#exitHold').classList.remove('show');
  },
  stop() {
    this.running = false;
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
    this.exitHoldStart = null;
    $('#gameHost').classList.remove('open');
    $('#gameOverlay').classList.remove('open');
    $('#exitHold').classList.remove('show');
    const id = this.id;
    if (id) {
      const mins = Math.max(1, Math.round((performance.now() - this.startTime) / 60000));
      S.play[id] = (S.play[id] || 0) + mins;
      S.last[id] = Date.now();
      save();
    }
    sfx('back');
    toast('Spiel beendet');
    if (curView === 'game') rerender(renderGame);
    if (curView === 'home') rerender(renderHome);
  }
};

/* ================= MINIGAMES (verbessert) ================= */
const GAMES = {
  snake: {
    create(W, H) {
      const cell = 22;
      const cols = Math.floor(W / cell), rows = Math.floor(H / cell);
      return { cell, cols, rows, snake: [{x: Math.floor(cols/2), y: Math.floor(rows/2)}], dir: {x:1,y:0}, food: {x:5,y:5}, acc: 0, score: 0, over: false, speed: 0.13 };
    },
    onResize(W, H) {
      if (!Game.state) return;
      const cell = 22;
      Game.state.cols = Math.floor(W / cell);
      Game.state.rows = Math.floor(H / cell);
    },
    update(s, dt, inp) {
      if (s.over) {
        if (inp.pad && inp.pad.a) { Object.assign(s, GAMES.snake.create(inp.W, inp.H)); s.over = false; }
        if (inp.keys['enter'] || inp.keys[' ']) { Object.assign(s, GAMES.snake.create(inp.W, inp.H)); s.over = false; }
        return;
      }
      s.acc += dt;
      const step = Math.max(0.06, s.speed - s.score * 0.004);
      let ndx = s.dir.x, ndy = s.dir.y;
      if (inp.keys['arrowleft'] || inp.keys['a'] || (inp.pad && inp.pad.left)) { ndx = -1; ndy = 0; }
      else if (inp.keys['arrowright'] || inp.keys['d'] || (inp.pad && inp.pad.right)) { ndx = 1; ndy = 0; }
      else if (inp.keys['arrowup'] || inp.keys['w'] || (inp.pad && inp.pad.up)) { ndx = 0; ndy = -1; }
      else if (inp.keys['arrowdown'] || inp.keys['s'] || (inp.pad && inp.pad.down)) { ndx = 0; ndy = 1; }
      if (ndx !== -s.dir.x || ndy !== -s.dir.y) { s.dir = {x:ndx,y:ndy}; }
      if (s.acc >= step) {
        s.acc = 0;
        const head = {x: s.snake[0].x + s.dir.x, y: s.snake[0].y + s.dir.y};
        if (head.x < 0 || head.y < 0 || head.x >= s.cols || head.y >= s.rows || s.snake.some(p => p.x===head.x && p.y===head.y)) { s.over = true; return; }
        s.snake.unshift(head);
        if (head.x === s.food.x && head.y === s.food.y) {
          s.score++;
          s.food = {x: Math.floor(Math.random()*s.cols), y: Math.floor(Math.random()*s.rows)};
        } else s.snake.pop();
      }
    },
    draw(ctx, s, W, H) {
      const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0a1a2e'); g.addColorStop(1,'#02060c');
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle = 'rgba(90,216,255,.06)';
      for (let x=0;x<W;x+=s.cell) { ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke(); }
      for (let y=0;y<H;y+=s.cell) { ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }
      const t = performance.now()/300;
      const r = s.cell/2 + Math.sin(t)*2;
      const fg = ctx.createRadialGradient(s.food.x*s.cell+s.cell/2, s.food.y*s.cell+s.cell/2, 0, s.food.x*s.cell+s.cell/2, s.food.y*s.cell+s.cell/2, r+4);
      fg.addColorStop(0,'#ff7a7a'); fg.addColorStop(1,'rgba(255,77,66,0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(s.food.x*s.cell+s.cell/2, s.food.y*s.cell+s.cell/2, r+4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ff4d42';
      ctx.beginPath(); ctx.arc(s.food.x*s.cell+s.cell/2, s.food.y*s.cell+s.cell/2, s.cell/2-3, 0, Math.PI*2); ctx.fill();
      s.snake.forEach((p,i) => {
        const a = i===0 ? 1 : 0.7 - i/(s.snake.length*2);
        ctx.fillStyle = i===0 ? '#5ad8ff' : `rgba(47,140,255,${Math.max(.2, a)})`;
        ctx.beginPath();
        ctx.roundRect(p.x*s.cell+2, p.y*s.cell+2, s.cell-4, s.cell-4, 5);
        ctx.fill();
      });
      ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif';
      ctx.fillText('Score: ' + s.score, 24, 44);
      if (s.over) {
        ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0,0,W,H);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('Game Over', W/2, H/2 - 20);
        ctx.font = '16px sans-serif'; ctx.fillStyle = '#93a6c8';
        ctx.fillText('A oder Enter zum Neustart', W/2, H/2 + 24);
        ctx.textAlign = 'left';
      }
    }
  },
  pong: {
    create(W, H) { return { W, H, ball:{x:W/2,y:H/2,vx:320,vy:210,r:11}, left:{x:22,y:H/2-45,w:12,h:90}, right:{x:W-34,y:H/2-45,w:12,h:90}, score:{l:0,r:0}, over:false, trail:[] }; },
    onResize(W, H) { if (!Game.state) return; Game.state.W = W; Game.state.H = H; },
    update(s, dt, inp) {
      if (s.over) { if (inp.keys['enter']||inp.keys[' ']||(inp.pad&&inp.pad.a)) { Object.assign(s, GAMES.pong.create(inp.W,inp.H)); s.over=false; } return; }
      const speed = 620;
      if (inp.keys['arrowup']||inp.keys['w']||(inp.pad&&inp.pad.up)) s.left.y -= speed*dt;
      if (inp.keys['arrowdown']||inp.keys['s']||(inp.pad&&inp.pad.down)) s.left.y += speed*dt;
      s.left.y = clamp(s.left.y, 0, s.H-s.left.h);
      const target = s.ball.y - s.right.h/2 + Math.sin(performance.now()/700)*10;
      s.right.y += clamp(target - s.right.y, -320*dt, 320*dt);
      s.right.y = clamp(s.right.y, 0, s.H-s.right.h);
      s.ball.x += s.ball.vx*dt; s.ball.y += s.ball.vy*dt;
      s.trail.push({x:s.ball.x,y:s.ball.y,life:.3}); 
      s.trail.forEach(t => t.life -= dt); s.trail = s.trail.filter(t=>t.life>0);
      if (s.ball.y < s.ball.r || s.ball.y > s.H-s.ball.r) s.ball.vy *= -1;
      if (s.ball.x < s.left.x+s.left.w && s.ball.y > s.left.y && s.ball.y < s.left.y+s.left.h && s.ball.vx < 0) { s.ball.vx *= -1.05; s.ball.x = s.left.x+s.left.w+1; s.ball.vy += (s.ball.y-(s.left.y+s.left.h/2))*3; }
      if (s.ball.x > s.right.x && s.ball.y > s.right.y && s.ball.y < s.right.y+s.right.h && s.ball.vx > 0) { s.ball.vx *= -1.05; s.ball.x = s.right.x-1; }
      if (s.ball.x < 0) { s.score.r++; s.ball = {x:s.W/2,y:s.H/2,vx:320,vy:210,r:11}; s.trail=[]; }
      if (s.ball.x > s.W) { s.score.l++; s.ball = {x:s.W/2,y:s.H/2,vx:-320,vy:210,r:11}; s.trail=[]; }
      if (s.score.l >= 7 || s.score.r >= 7) s.over = true;
    },
    draw(ctx, s, W, H) {
      const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0a0f2e'); g.addColorStop(1,'#02040c');
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle = 'rgba(90,216,255,.2)'; ctx.setLineDash([12,12]); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
      s.trail.forEach(t => {
        const a = Math.max(0, t.life * 2);
        ctx.fillStyle = `rgba(90,216,255,${a})`;
        ctx.beginPath(); ctx.arc(t.x, t.y, s.ball.r * (0.4 + a), 0, Math.PI*2); ctx.fill();
      });
      const lg = ctx.createLinearGradient(0, s.left.y, 0, s.left.y+s.left.h);
      lg.addColorStop(0,'#5ad8ff'); lg.addColorStop(1,'#2f8cff');
      ctx.fillStyle = lg; ctx.beginPath(); ctx.roundRect(s.left.x, s.left.y, s.left.w, s.left.h, 6); ctx.fill();
      const rg = ctx.createLinearGradient(0, s.right.y, 0, s.right.y+s.right.h);
      rg.addColorStop(0,'#ff4fa3'); rg.addColorStop(1,'#c0207a');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.roundRect(s.right.x, s.right.y, s.right.w, s.right.h, 6); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.ball.x, s.ball.y, s.ball.r, 0, Math.PI*2); ctx.fill();
      ctx.font = 'bold 42px sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(90,216,255,.85)'; ctx.fillText(s.score.l, W/2-80, 70);
      ctx.fillStyle = 'rgba(255,79,163,.85)'; ctx.fillText(s.score.r, W/2+80, 70);
      ctx.textAlign = 'left';
      if (s.over) {

function takeShot() {
  const c = document.createElement('canvas');
  c.width = 640; c.height = 360;
  const x = c.getContext('2d');
  x.drawImage(bg, 0, 0, 640, 360);
  x.fillStyle = 'rgba(0,0,0,.45)'; x.fillRect(0, 324, 640, 36);
  x.fillStyle = '#e6eefc'; x.font = '14px sans-serif';
  x.fillText('NoxuraFluxOS 9.0 · ' + new Date().toLocaleString('de-DE'), 16, 347);
  const d = c.toDataURL('image/jpeg', .75);
  S.captures.unshift({ d, t: new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) });
  S.captures = S.captures.slice(0, 12);
  save(); sfx('ok'); toast('Screenshot gespeichert');
}

  }

  if (!matches.length) {
    box.innerHTML = `<div class="search-empty">Keine Ergebnisse für „${esc(q)}"</div>`;
    $('#searchHint').textContent = matches.length + ' Ergebnis(se)';
    return;
  }
  $('#searchHint').textContent = matches.length + ' Ergebnis(se)';
  let html = '';
  const owned = matches.filter(([id]) => S.owned.includes(id) || CATALOG[id].demo);

  if (owned.length) {
    html += `<div class="search-group">Installiert & bereit</div>`;

  }

    html += store.map(([id, g]) => cardHTML(id, g)).join('');
  }

  if (first) setFocus(first, true);

  settings: () => renderSettings()
};

/* ================= input ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-f]');
  if (el) { e.preventDefault(); primeAudio(); if (ACT[el.dataset.action]) { try { ACT[el.dataset.action](el, e); } catch (err) { console.error(err); } } }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('input[type=range][data-f]')) {
    const k = el.dataset.key, o = holder(k);
    o[k] = +el.value;
    el.style.setProperty('--p', ((el.value - el.min) / (el.max - el.min) * 100) + '%');
    const lbl = $('[data-lbl="' + k + '"]', el.parentElement);
    if (lbl) lbl.textContent = el.value + (el.dataset.unit || '');
    save();
    if (k === 'vol') updateVolUI();
    if (k === 'ui' || k === 'frame') applyPrefs();
  }
  if (el.id === 'searchInput') {
    renderSearchResults(el.value);
  }
});

/* ================= keyboard + gamepad global ================= */
document.addEventListener('keydown', e => {
  primeAudio();
  if (Game.running) return;
  if (searchOpen()) {
    if (e.key === 'Escape') { e.preventDefault(); closeSearch(); }
    return;
  }
  if (e.key === 'Escape') { e.preventDefault(); if (dialogOpen()) closeDialog(-1); else if (qmOpen()) closeQuick(); else if (friendsOpen()) closeFriends(); else goBack(); return; }
  if (dialogOpen()) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); moveSeq(-1); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); moveSeq(1); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (focusEl && ACT[focusEl.dataset.action]) ACT[focusEl.dataset.action](focusEl, e); }
    return;
  }
  if (qmOpen() || friendsOpen()) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); move('left'); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); move('right'); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move('up'); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); move('down'); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (focusEl && ACT[focusEl.dataset.action]) ACT[focusEl.dataset.action](focusEl, e); }
    return;
  }
  if (curView === 'boot') { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); skipBoot(); } return; }
  if (e.key === 'ArrowLeft') { e.preventDefault(); move('left'); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); move('right'); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); move('up'); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); move('down'); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (focusEl && ACT[focusEl.dataset.action]) ACT[focusEl.dataset.action](focusEl, e); }
  else if (e.key === 'Backspace') { e.preventDefault(); goBack(); }
  else if (e.key.toLowerCase() === 'y') { e.preventDefault(); if (qmOpen()) closeQuick(); else openQuick(); }
  else if (e.key.toLowerCase() === 'x') { e.preventDefault(); openSearch(); }
  else if (e.key.toLowerCase() === 'q' || e.key === 'PageUp') { e.preventDefault(); cycleTab(-1); }
  else if (e.key.toLowerCase() === 'e' || e.key === 'PageDown') { e.preventDefault(); cycleTab(1); }
});

/* gamepad navigation outside games */
function gamepadNavLoop() {
  if (Game.running) { requestAnimationFrame(gamepadNavLoop); return; }
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  if (pads) for (const p of pads) {
    if (!p || !p.connected) continue;
    const now = performance.now();
    if (!p._lastNav) p._lastNav = 0;
    if (!p._stickReset) p._stickReset = true;
    if (!p._lockUntil) p._lockUntil = 0;
    const sens = S.prefs.stickSens || 'normal';
    const dz = sens === 'slow' ? 0.7 : sens === 'fast' ? 0.4 : 0.55;
    const lockMs = sens === 'slow' ? 400 : sens === 'fast' ? 200 : 280;
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    const inDeadzone = Math.abs(ax) < dz && Math.abs(ay) < dz;
    if (inDeadzone) p._stickReset = true;
    if (p._stickReset && now - p._lockUntil > 0) {
      let dir = null;
      if (ax < -dz || (p.buttons[14] && p.buttons[14].pressed)) dir = 'left';
      else if (ax > dz || (p.buttons[15] && p.buttons[15].pressed)) dir = 'right';
      else if (ay < -dz || (p.buttons[12] && p.buttons[12].pressed)) dir = 'up';
      else if (ay > dz || (p.buttons[13] && p.buttons[13].pressed)) dir = 'down';
      if (dir && !searchOpen()) {
        move(dir);
        p._stickReset = false;
        p._lockUntil = now + lockMs;
      }
    }
    if (searchOpen()) {
      if (p.buttons[1] && p.buttons[1].pressed && now - (p._lastB || 0) > 350) { p._lastB = now; closeSearch(); }
      continue;
    }
    if (p.buttons[0] && p.buttons[0].pressed && now - (p._lastA || 0) > 350) {
      p._lastA = now;
      if (focusEl && ACT[focusEl.dataset.action]) { try { ACT[focusEl.dataset.action](focusEl, { type: 'gamepad' }); } catch (err) {} }
    }
    if (p.buttons[1] && p.buttons[1].pressed && now - (p._lastB || 0) > 400) {
      p._lastB = now;
      if (dialogOpen()) closeDialog(-1);
      else if (qmOpen()) closeQuick();
      else if (friendsOpen()) closeFriends();
      else if (curView !== 'home' && curView !== 'boot' && curView !== 'setup') goBack();
    }
    if (p.buttons[4] && p.buttons[4].pressed && now - (p._lastL1 || 0) > 300) {
      p._lastL1 = now; cycleTab(-1);
    }
    if (p.buttons[5] && p.buttons[5].pressed && now - (p._lastR1 || 0) > 300) {
      p._lastR1 = now; cycleTab(1);
    }
    if (p.buttons[3] && p.buttons[3].pressed && now - (p._lastY || 0) > 400) {
      p._lastY = now;
      if (qmOpen()) closeQuick(); else openQuick();
    }
  }
  requestAnimationFrame(gamepadNavLoop);
}

/* ================= boot loop / init ================= */
function loop(now) { drawBG(now); requestAnimationFrame(loop); }
window.addEventListener('resize', () => { resizeBG(); if (Game.running) Game.resize(); });
window.addEventListener('orientationchange', () => setTimeout(() => { resizeBG(); if (Game.running) Game.resize(); }, 300));
setInterval(tickClock, 1000);
if (navigator.getBattery) navigator.getBattery().then(b => { const upd = () => { const el = $('#batPct'); if (el) el.textContent = Math.round(b.level * 100) + '%'; }; upd(); b.addEventListener('levelchange', upd); }).catch(() => {});
applyPrefs(); resizeBG(); tickClock();
Game.init();
pollGamepads();
setInterval(pollGamepads, 1000);
requestAnimationFrame(loop);
requestAnimationFrame(gamepadNavLoop);
startBoot();
})();
</script>
